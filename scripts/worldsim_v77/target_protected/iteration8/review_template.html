<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>body{margin:0;background:#101824;color:#e0e8f0;font:15px/1.6 system-ui}main{max-width:1920px;margin:auto;padding:24px}h1{font-size:27px}h2{font-size:20px}a{color:#90cbff}button,select,input,textarea{background:#233448;color:#fff;border:1px solid #576b80;border-radius:5px;padding:6px}button{cursor:pointer}textarea{width:98%}section,.box{background:#172334;border:1px solid #334760;padding:16px;margin:18px 0;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}video,img{width:100%;background:#090e15}img{display:block}figure{margin:0}figcaption{font-weight:600}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #394d64}p{margin:7px 0}.muted{color:#afbed1}.scores{display:flex;gap:12px;flex-wrap:wrap}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}summary{cursor:pointer}svg{width:100%;height:auto;max-height:210px}nav{position:sticky;top:0;background:#142133;padding:10px;z-index:10}small{color:#afbed1}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style>
<main><h1>__TITLE__</h1>__INTRO__
<div class="box"><svg viewBox="0 0 1180 170" role="img" aria-label="数据与模型组件图"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91cfff"/></marker></defs><g fill="#233e59" stroke="#789bbd"><rect x="10" y="20" width="170" height="60" rx="8"/><rect x="220" y="20" width="215" height="60" rx="8"/><rect x="480" y="20" width="210" height="60" rx="8"/><rect x="735" y="20" width="200" height="60" rx="8"/><rect x="980" y="20" width="180" height="60" rx="8"/></g><g fill="white" font-size="18" text-anchor="middle"><text x="95" y="44">真实 nuScenes Y</text><text x="95" y="66">相机／GT／LiDAR</text><text x="327" y="44">显式车辆轮廓＋SE(3)</text><text x="327" y="66">保护车 SAM2 mask</text><text x="585" y="44">完整洞 H 擦除 X</text><text x="585" y="66">Y 仅作真实监督</text><text x="835" y="44">原结构 DriveEditor</text><text x="835" y="66">同 80 张量／160 步</text><text x="1070" y="44">原／r7／新数据</text><text x="1070" y="66">两套固定评测</text></g><g stroke="#91cfff" stroke-width="2" marker-end="url(#a)"><path d="M180,50 H215"/><path d="M435,50 H475"/><path d="M690,50 H730"/><path d="M935,50 H975"/><path d="M95,82 V120 H835 V84" fill="none"/></g><text x="400" y="143" fill="#cfdfef" font-size="17">真实 Y → 训练 target；隐藏区域 Y 不进入生成条件；final set 未使用</text></svg></div>
<nav><a href="index.html">模型对照</a> · <a href="data_review.html">造数据逐帧审核</a> · <button id="export">导出人工评分 CSV</button> <button id="exportjson">导出 JSON</button> <label>筛选 <select id="filter"><option value="all">全部</option></select></label> <span id="progress"></span></nav><div id="cases"></div></main>
<script>const DATA=__DATA__;const storageKey='v77-r8-'+DATA.mode;let scores={};try{scores=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{};const roles=DATA.roles;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){localStorage.setItem(storageKey,JSON.stringify(scores));let count=Object.values(scores).filter(s=>s.score!==''&&s.score!=null).length;document.querySelector('#progress').textContent=`已填 ${count} 项人工评分；AI 分数独立保存`}
function pad(i){return String(i).padStart(3,'0')}
function render(){let f=document.querySelector('#filter').value;document.querySelector('#cases').innerHTML=DATA.cases.filter(c=>f==='all'||c.group===f).map(c=>`<section id="${esc(c.id)}"><h2>${esc(c.id)} · ${esc(c.scene)} · ${esc(c.type||c.kind)}</h2><p>${esc(c.note)}</p><p class="muted">${esc(c.qa||'人工评分为空。单帧观察不认证时序。')}</p><div class="grid" style="--cols:${roles.length}">${roles.map(r=>`<figure><figcaption>${esc(r.label)}</figcaption><video controls muted loop playsinline preload="none" src="${esc(c.videos[r.key])}" poster="${esc(c.frame_pattern.replace('{i}',pad(c.review_frame)).replace('{role}',r.key))}"></video><img data-role="${esc(r.key)}" src="${esc(c.frame_pattern.replace('{i}',pad(c.review_frame)).replace('{role}',r.key))}" loading="lazy"><small><a href="${esc(c.videos[r.key])}">打开视频</a></small></figure>`).join('')}</div><div class="controls"><button data-play>同步从头播放</button><button data-pause>暂停</button><label>逐帧 <input data-frame type="range" min="0" max="9" value="${c.review_frame}" step="1"></label><span data-ftext>f${c.review_frame} / 10帧</span></div><div class="scores">${DATA.score_roles.map(r=>`<label>${esc(r.label)} <select data-score="${r.key}"><option value="">未评</option><option value="0">0 失败</option><option value="1">1 不理想</option><option value="2">2 可接受</option></select></label>`).join('')}</div><textarea data-note rows="2" placeholder="当前帧备注；0/1/2只由你填写"></textarea>${c.native_links?`<details><summary>原生整帧输出（独立于局部写回）</summary>${Object.entries(c.native_links).map(([k,v])=>`<a href="${esc(v)}">${esc(k)} native</a>`).join(' · ')}</details>`:''}${c.metrics?`<details><summary>本例量化结果／输入信息</summary><pre>${esc(JSON.stringify(c.metrics,null,2))}</pre></details>`:''}</section>`).join('');
 for(const c of DATA.cases){const s=document.getElementById(c.id);if(!s)continue;let idx=c.review_frame;
 const restore=()=>{for(const sel of s.querySelectorAll('[data-score]')){const k=c.id+'|'+idx+'|'+sel.dataset.score;sel.value=scores[k]?.score??''}s.querySelector('[data-note]').value=scores[c.id+'|'+idx+'|note']?.note??''};restore();
 s.querySelector('[data-frame]').oninput=e=>{idx=Number(e.target.value);s.querySelector('[data-ftext]').textContent=`f${idx} / 10帧（${(idx/10).toFixed(1)}s）`;for(const im of s.querySelectorAll('img[data-role]'))im.src=c.frame_pattern.replace('{i}',pad(idx)).replace('{role}',im.dataset.role);for(const v of s.querySelectorAll('video')){v.pause();v.currentTime=idx/10}restore()};
 s.querySelector('[data-play]').onclick=()=>{for(const v of s.querySelectorAll('video')){v.currentTime=0;v.play().catch(()=>{})}};s.querySelector('[data-pause]').onclick=()=>s.querySelectorAll('video').forEach(v=>v.pause());
 s.querySelectorAll('[data-score]').forEach(sel=>sel.onchange=()=>{const k=c.id+'|'+idx+'|'+sel.dataset.score;scores[k]={case_id:c.id,scene:c.scene,frame:idx,role:sel.dataset.score,score:sel.value};store()});
 s.querySelector('[data-note]').onchange=e=>{scores[c.id+'|'+idx+'|note']={case_id:c.id,scene:c.scene,frame:idx,role:'note',note:e.target.value};store()};}store();}
for(const g of [...new Set(DATA.cases.map(c=>c.group))]){let o=document.createElement('option');o.value=g;o.textContent=g;document.querySelector('#filter').append(o)}document.querySelector('#filter').onchange=render;
function download(text,name,mime){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelector('#exportjson').onclick=()=>download(JSON.stringify({run:'r8',human:true,mode:DATA.mode,scores:Object.values(scores)},null,2),'v77_r8_'+DATA.mode+'_human.json','application/json');
document.querySelector('#export').onclick=()=>{const quote=s=>'"'+String(s??'').replaceAll('"','""')+'"';let rows=[['case_id','scene','frame','role','human_score','note']];for(const c of DATA.cases)for(let i=0;i<10;i++)for(const r of DATA.score_roles){let s=scores[c.id+'|'+i+'|'+r.key]||{};let n=scores[c.id+'|'+i+'|note']||{};rows.push([c.id,c.scene,i,r.key,s.score??'',n.note??''])}download('\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n'),'v77_r8_'+DATA.mode+'_human.csv','text/csv;charset=utf-8')};render();</script></html>
