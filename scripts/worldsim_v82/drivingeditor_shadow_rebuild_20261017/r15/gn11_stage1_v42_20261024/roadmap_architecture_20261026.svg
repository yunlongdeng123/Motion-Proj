<rect x="775" y="392" width="385" height="92" rx="10"/>
<rect x="355" y="532" width="805" height="65" rx="10" fill="#fff"/>
</g>
<g text-anchor="middle" font-size="20">
<text x="170" y="107">固定 V41-B 主副本</text><text x="170" y="134" font-size="16">原生权重与渲染通路</text>
<text x="1017" y="107">默认完整重建</text><text x="1017" y="134" font-size="16">身份及输出隔离检查</text>
<text x="155" y="278">道路 RGB / LiDAR</text><text x="155" y="310">相机、世界缺口</text><text x="155" y="342" font-size="16">已知 / 自由空间 / 未知</text>
<text x="525" y="234" font-weight="700">先：FreeInpaint</text><text x="525" y="264" font-size="16">图像与掩码 → 中心三维候选</text>
<text x="525" y="369" font-weight="700">后：TRELLIS 道路适配</text><text x="525" y="399" font-size="16">已知道路编解码 → 中心预测</text><text x="525" y="427" font-size="16">条件流后训练：下一阶段候选</text>
<text x="967" y="280">统一候选适配与世界对齐</text><text x="967" y="311" font-size="16">米制几何 / 高斯 / 来源 / 未知域</text>
<text x="967" y="426">独立编辑副本</text><text x="967" y="457" font-size="16">局部残影处理 + 中心道路 → 编辑输出</text>
<text x="757" y="558">统一验收：边界 / 过渡 / 内部核心</text><text x="757" y="582" font-size="16">几何、留出视角、实际贡献；真实未知不伪造真值</text>
</g>
