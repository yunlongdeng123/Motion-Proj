<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">V42：统一编辑架构，两阶段先验验证</title>
<desc id="desc">固定 V41-B 主副本直接完整重建。RGB、LiDAR 和三维缺口先进入 FreeInpaint，后续候选是经过道路编解码验证和后训练的 TRELLIS。生成结果经世界对齐、独立编辑副本和局部污染处理后输出编辑图；按边界到核心验收。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#547084"/></marker></defs>
<rect width="1200" height="630" rx="16" fill="#f6f9fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#18364b">
<text x="35" y="45" font-size="26" font-weight="700">先验证中心补全闭环，再验证道路专用后训练</text>
<g stroke="#9db2c3" stroke-width="1.5" fill="#e7eef5">
