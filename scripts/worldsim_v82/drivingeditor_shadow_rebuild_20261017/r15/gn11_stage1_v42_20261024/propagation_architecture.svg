<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="350" viewBox="0 0 1320 350"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#526377"/></marker></defs><rect width="1320" height="350" fill="#f5f8fc"/><g font-family="Arial,Microsoft YaHei" font-size="20" text-anchor="middle" fill="#16324e"><rect x="20" y="20" width="280" height="70" rx="10" fill="#dcecdf"/><text x="160" y="62">原 V1 主副本</text><rect x="340" y="20" width="310" height="70" rx="10" fill="#dcecdf"/><text x="495" y="62">原生完整重建输出</text><text x="950" y="62">完整通路不加载本轮候选或编辑状态</text><rect x="20" y="165" width="230" height="85" rx="10" fill="#e0e9f7"/><text x="135" y="200">49 帧现有证据</text><text x="135" y="229">RGB / LiDAR / 道路种子</text><rect x="290" y="165" width="250" height="85" rx="10" fill="#e0e9f7"/><text x="415" y="200">平面传播与射线求交</text><text x="415" y="229">生成新位置 / 法线</text><rect x="580" y="165" width="290" height="85" rx="10" fill="#e0e9f7"/><text x="725" y="200">可见来源几何 + 色块核验</text><text x="725" y="229">另组来源验证；不取车身 RGB</text><rect x="910" y="165" width="380" height="85" rx="10" fill="#e0e9f7"/><text x="1100" y="200">候选点文件 + 固定区域覆盖报告</text><text x="1100" y="229">仅供独立编辑副本；尚未训练 / 渲染</text><text x="660" y="310" font-size="18">无观测的候选保留几何先验身份；不能当作真实颜色监督或成功补全</text></g><g stroke="#526377" stroke-width="2" marker-end="url(#a)"><path d="M300 55H340"/><path d="M250 207H290"/><path d="M540 207H580"/><path d="M870 207H910"/></g></svg>