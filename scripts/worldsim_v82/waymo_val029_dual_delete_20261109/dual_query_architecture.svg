<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#58778a"/></marker></defs><rect width="1080" height="350" rx="12" fill="#f4f8fb"/><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#264959"><text x="540" y="35" font-size="23" font-weight="700">同一份场景，两个不同的删除请求</text><g stroke="#a8c2d2" stroke-width="1.5"><rect x="25" y="125" width="205" height="108" rx="12" fill="#e4eef7"/><rect x="280" y="70" width="220" height="80" rx="12" fill="#e4eef7"/><rect x="280" y="205" width="220" height="92" rx="12" fill="#e3f1eb"/><rect x="550" y="205" width="235" height="92" rx="12" fill="#fff0da"/><rect x="840" y="70" width="215" height="80" rx="12" fill="#e4eef7"/><rect x="840" y="205" width="215" height="92" rx="12" fill="#e3f1eb"/></g><g font-size="18" font-weight="700"><text x="127" y="161">已有完整重建</text><text x="390" y="103">无编辑直通</text><text x="390" y="237">冻结的可编辑场景</text><text x="668" y="237">指定删除目标</text><text x="948" y="103">原生重建参照</text><text x="948" y="237">统一深度渲染</text></g><g font-size="15"><text x="127" y="190">同一相机、时间与模型</text><text x="127" y="215">不重新训练</text><text x="390" y="131">直接使用原渲染器</text><text x="390" y="265">归属 / 车辆资产 / 道路</text><text x="390" y="287">现有交接参数保持固定</text><text x="668" y="265">Case 1：红车</text><text x="668" y="287">Case 2：后方白色 SUV</text><text x="948" y="131">完整画面，无编辑</text><text x="948" y="265">KEEP：保留全部</text><text x="948" y="287">两份不同目标的 DELETE</text><text x="540" y="332">只改变被移除的实例行；其余表示复用。新显露背景没有独立真值，未为白车另拟合背景。</text></g></g><g fill="none" stroke="#58778a" stroke-width="2" marker-end="url(#a)"><path d="M230 179H252V110H280"/><path d="M230 179H252V250H280"/><path d="M500 110H840"/><path d="M500 250H550"/><path d="M785 250H840"/></g></svg>
