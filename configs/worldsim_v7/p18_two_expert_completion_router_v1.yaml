runs_root: /root/autodl-tmp/runs
p2_config: configs/worldsim_v7/p2_av2_four_action_compile_v1.yaml
p4_config: configs/worldsim_v7/p4_nuscenes_selective_factorization_v1.yaml
base_expert_config: configs/worldsim_v7/p17r_hybrid_ray_chamfer_completion_v1.yaml
base_expert_fit_run: /root/autodl-tmp/runs/worldsim_v7/WS-V7-P17R-HYBRID-RAY-CHAMFER-FIT-01/20260903T094500Z__hybrid-ray-chamfer-s71701-r1
