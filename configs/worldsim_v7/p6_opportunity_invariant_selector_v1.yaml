claim_boundary: >-
  A single recovery of V7-F11. Model design, fitting, standardization, and repair-threshold
  calibration use nuScenes only. The consumed 30-log AV2 cohort is unavailable for candidate
  selection and thresholding. External recovery quality is read exactly once on the frozen,
