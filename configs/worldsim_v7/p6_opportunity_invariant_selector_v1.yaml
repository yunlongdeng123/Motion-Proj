validity_representation:
  feature_names:
    - log_query_points
    - log_canonical_surfels_per_observation
    - query_surface_mean_m
    - query_surface_p95_m
    - clean_keep_fraction
    - unknown_query_fraction
    - temporal_support_fraction_mean
    - temporal_support_fraction_p10
    - view_support_fraction_mean
    - completion_candidate_fraction
    - compiled_to_query_ratio
    - sensor_range_m
  remove_raw_observation_frame_count: true
  count_ratio_floor: 1.0
model:
  seed: 70601
  hidden_dim: 32
  epochs: 80
  batch_size: 256
  learning_rate: 0.002
  weight_decay: 0.0001
selective_risk:
  false_repair_alpha: 0.05
  threshold_source: nuScenes calibration only
opportunity_intervention:
  scale_factors: [0.5, 2.0]
  maximum_transformed_feature_shift: 1.0e-6
gates:
