hypothesis_id: WS-V7-H-P17
fit_task_id: WS-V7-P17-RAY-SET-COMPLETION-FIT-01
external_task_id: WS-V7-P17-RAY-SET-COMPLETION-EXTERNAL-01
runs_root: /root/autodl-tmp/runs
p2_config: configs/worldsim_v7/p2_av2_four_action_compile_v1.yaml
p4_config: configs/worldsim_v7/p4_nuscenes_selective_factorization_v1.yaml
fresh_av2_cohort: configs/worldsim_v7/av2_evicomp_fresh_cohort_v1.json
fresh_download_state: /root/autodl-tmp/data/av2/v7_p16_download_state
device: cuda
claim_boundary: >-
  One source-only completion selector is optimized jointly through first-return ray
  transmittance on nuScenes train+calibration and evaluated on disjoint nuScenes test.
  The same frozen checkpoint may receive one metadata-frozen AV2 read only after both
  source physical directions pass. Binary scores are not calibrated occupancy,
  causal interventions, collision certificates, or road-safety guarantees.
model:
  seed: 71701
  hidden_dim: 64
  epochs: 160
  actor_batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  maximum_training_rays_per_actor: 1024
  forward_selection_threshold: 0.5
  forward_selection: hard
  backward_gradient: straight_through_sigmoid
  loss: mean_actor_smooth_l1_first_return_depth
attribution:
  distance_chunk_size: 1024
  ray_lateral_tolerance_m: 0.20
  depth_tolerance_m: 0.20
source_decision:
  - hazard_new_early_strictly_lower
  - population_chamfer_no_worse_than_frozen_baseline
external_decision:
  - hazard_new_early_strictly_lower
  - population_chamfer_no_worse_than_frozen_baseline
verdict_on_pass: supported_source_trained_ray_set_completion_pareto_transfer
verdict_on_failure: rejected_source_trained_ray_set_completion_pareto_transfer
