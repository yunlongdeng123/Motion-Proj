claim_boundary: >-
  A low-capacity validity head is trained only on nuScenes to predict whether the frozen
  four-action compiler is no worse than the original clean query for an individual Actor.
  A structurally separate hazard head reads only analytic motion geometry. The repair
  threshold is calibrated only on disjoint nuScenes scenes; AV2 uses the frozen model and
  threshold zero-shot. The nuScenes risk statement relies on exchangeability and does not
  transfer as a formal conformal or road-safety guarantee to AV2.
