schema_version: worldsim_v72.route_selection.v1
status: clean_split_frozen_materialization_pending
decision: undecided
clean_source_split: configs/worldsim_v72/clean_route_split.yaml
clean_source_counts: {dev_logs: 4, route_select_logs: 3, source_test_candidate_logs: 3}
preliminary_evidence:
  g0_run: run://worldsim_v72/WS-V72-D0-G0-RAW-FUSION-01/20260906T153519Z__g0-raw-fusion-cpu-r1
  g1_run: run://worldsim_v72/WS-V72-D0-G1-ACTOR-TSDF-01/20260906T160409Z__g1-actor-tsdf-cpu-r3
  g2_run: run://worldsim_v72/WS-V72-D0-G2-M8-MATCHED-EVAL-01/20260906T174000Z__g2-m8-matched-s71110-r1
  g3_zero_shot_run: run://worldsim_v72/WS-V72-D0-G3-ADAPOINTR-OFFICIAL-ZS-01/20260906T165000Z__g3-adapointr-official-zs-r3
  g3_transfer_run: run://worldsim_v72/WS-V72-D0-G3-ADAPOINTR-TRANSFER-01/20260906T165500Z__g3-adapointr-transfer-s7203-r1
  g3_scratch_run: run://worldsim_v72/WS-V72-D0-G3-ADAPOINTR-SCRATCH-01/20260906T174200Z__g3-adapointr-scratch-s7204-r1
  w0_w4_g0_run: run://worldsim_v72/WS-V72-D0-W0-W4-G0-01/20260906T185900Z__w0-w4-g0-s7205-r3
  w0_w4_g2_run: run://worldsim_v72/WS-V72-D0-W0-W4-G2-01/20260906T190200Z__w0-w4-g2-s7206-r1
  lidar4d_capability_run: run://worldsim_v72/WS-V72-B0-LIDAR4D-CAPABILITY-01/20260906T192557Z__lidar4d-kitti360-f4950-s0-r2
  interpretation:
    - density_is_a_strong_geometry_return_confound
    - actor_tsdf_and_raw_fusion_form_a_non_dominated_simple_baseline_frontier
    - adapointr_pretraining_transfers_but_does_not_clear_density_matched_g0_g1
    - legacy_m8_is_a_conservative_early_return_frontier_with_large_geometry_cost
    - d0_geometry_matrix_complete_on_legacy_diagnostic
    - scalar_response_head_recovers_the_main_learned_weighting_gain
    - fou_structure_and_auxiliary_supervision_lack_cross_geometry_gain
    - d0_geometry_and_weight_matrix_complete_on_legacy_diagnostic
    - lidar4d_full_scan_capability_complete_on_public_kitti360
    - clean_route_data_remains_required
  route_decision_allowed: false
allowed_evidence_roles: [dev, legacy_diagnostic, external_public_capability]
forbidden_evidence_roles: [source_test, external_test]
criteria:
  - task_validity
  - gain_over_strong_external_baseline
  - simple_explanation_control
  - log_level_stability
  - complete_application
  - measured_compute_cost
preregistered_d1_rule:
  route_a_primary: A1_anchored_surface
  route_a_diagnostic_only: A1_observation_constrained
  matched_density_budget: 512
  comparator_pool: [G0_raw, G1_tsdf, G3_adapointr]
  primary_effect_any:
    relative_cd_reduction_vs_best: 0.05
    absolute_fscore_gain_vs_best: 0.02
  side_effect_limits:
    maximum_early_rate_increase_vs_best: 0.01
    minimum_hit_recall_delta_vs_best: -0.01
  development_requirement: primary_effect_and_both_side_effect_limits
  route_select_requirement:
    aggregate_same_gate: true
    minimum_log_count_with_nonnegative_primary_direction: 2
    total_route_select_log_count: 3
  route_b_requirement:
    full_scan_output: true
    matched_protocol_gain_over_lidar4d_required: true
    capability_only_does_not_count_as_method_gain: true
  outcome:
    a_pass_b_fail: select_route_a
    a_fail_b_pass: select_route_b
    both_pass: select_more_stable_complete_lower_cost_route
    both_fail: close_method_claim_and_publish_diagnostic_baseline_report_only
