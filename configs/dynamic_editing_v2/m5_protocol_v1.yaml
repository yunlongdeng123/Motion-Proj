  prompt: "car. truck. bus. pedestrian. bicycle. motorcycle."
  box_threshold: 0.25
  text_threshold: 0.25
  sample_frames: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180]
failure_priority:
  - BASELINE_RUNTIME_FAILURE
  - ACTOR_IDENTITY_MISMATCH
  - ACTOR_GEOMETRY_DEFORMATION
  - TRAJECTORY_NOT_FOLLOWED
  - SOURCE_RESIDUAL
  - SHADOW_RESIDUAL
  - BACKGROUND_HOLE
  - DEPTH_ORDERING_ERROR
  - NEW_OCCLUSION_ERROR
  - MULTICAMERA_INCONSISTENCY
  - TEMPORAL_FLICKER
  - NON_TARGET_VISUAL_DRIFT
  - NON_TARGET_PERCEPTION_DRIFT
  - UNSUPPORTED_DISOCCLUSION
  - INSUFFICIENT_EVIDENCE
thresholds:
  trajectory_translation_max_m: 0.02
  trajectory_rotation_max_deg: 1.0
  geometry_drift_max_m: 0.01
  vacated_source_residual_mean_abs_max: 0.02
  non_target_psnr_min: 35.0
  non_target_ssim_min: 0.98
  non_target_lpips_max: 0.05
  depth_ordering_violation_rate_max: 0.01
  temporal_boundary_lpips_max: 0.20
  perception_match_iou_min: 0.70
  perception_false_disappearance_max: 0.05
  unsupported_disocclusion_rate_max: 0.50
  minimum_effect_pixels_per_sequence: 100
truth_tiers:
  A: held-out observed image excluded before optimization; RGB/depth/perception allowed
  B: finite static Gaussian or LiDAR/multiview geometry support; RGB accuracy forbidden
  C: no verifiable observation; only uncertainty/coverage/ABSTAIN/human review
quality_claim: automatic thresholds diagnose failures but never replace human visual review
