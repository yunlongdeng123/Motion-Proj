paper_claim:
  title: "EviDelta-GS: Evidence-Calibrated Temporal Delta Assets for Editable Driving World Simulation"
  central_claim: >-
    将对象归属、几何支持、来源真实性、不确定性与时序记忆统一为 Gaussian evidence state，
    以 Bayes risk 选择 observed/donor/generated/abstain repair，并通过连续时间可逆 delta 实现时序一致编辑。
  contribution_limit: 4
  no_unimplemented_formula: true
  no_generated_ground_truth: true
  no_pixel_level_significance: true
  main_contributions:
    - evidence_calibrated_gaussian_field
    - evidence_prioritized_delta_compiler
    - temporal_reversible_delta_operator
    - cross_scene_cross_dataset_engineering_validation

method_schema:
  base_asset:
    symbol: G_0
    fields: [center, covariance, appearance_opacity, sh_or_color, provenance_instance_metadata]
    implementation_source: v33_streetgs_asset
    train_new_base_required: false
  evidence_state:
    symbol: E_i_a_t
    distribution: beta
    parameters: [alpha_e, beta_e]
    posterior_mean: alpha_e/(alpha_e+beta_e)
    posterior_variance: alpha_e*beta_e/((alpha_e+beta_e)^2*(alpha_e+beta_e+1))
  multi_view_update:
    evidence_sources: [object_mask, rendering_visibility, depth_consistency, lidar_support, camera_confidence]
    alpha_update: alpha_0+sum(weight*evidence)
    beta_update: beta_0+sum(weight*(1-evidence))
  temporal_memory:
    update: state_t=rho*state_t_minus_1+(1-rho)*observation_t
    rho_fit_split: development
  calibration:
    candidates: [raw, temperature, beta]
    fit_split: development
    validation_read_only: true
    test_read_only: true
    fallback: raw
  authenticity:
    symbol: q_i
    range: [0.0, 1.0]
    provenance_order: [observed_or_lidar_or_real_donor, cross_view_reconstructed, generated, unknown]
    is_ground_truth: false
  repair_risk:
    candidates: [observed, donor, generated, abstain]
    terms: [photo, geometry, temporal, uncertainty, compute]
    decision: argmin_risk
    abstain_condition: min_risk_gt_tau
    lambda_fit_split: development
  temporal_transform:
    group: SE3
    algebra: se3
    basis: cubic_bspline
    transform: T_0_exp_hat_xi_t
    supported_edits: [remove, lateral, insert]
  reversible_delta:
    state: [erase_selector, inserted_gaussians]
    composition_level: asset_state
    claims_image_space_linearity: false
    base_immutable: true
    rollback_render_sha_exact: true

