scientific_scope:
  title: "StructDelta-GS: Structured, Geometry-Safe and Physics-Constrained Gaussian Editing for Driving World Simulation"
  central_problem: >-
    将 observation reliability、Gaussian physical topology、geometry feasibility、selective uncertainty
    和 temporal constraints 分层建模，而不是压入单一 posterior 或 scalar risk。
  contribution_limit: 4
  contributions:
    - structured_gaussian_ownership
    - geometry_feasible_selective_repair
    - constraint_projected_temporal_delta
    - transactional_reversible_gaussian_editing
  explicit_non_claims:
    - full_world_model
    - closed_loop_safety_sota
    - physics_simulator
    - guaranteed_collision_free_planning
    - generated_content_is_ground_truth
    - universal_cross_city_or_weather_generalization

method_boundaries:
  immutable_base: true
  m1:
    hypothesis: reliability_aware_bayesian_unary_plus_physical_topology
    first_task: WS-V5-M1-D0-BAYES-FORENSICS-01
    transformer_expansion_allowed: false
    semantic_split_task_status: pending
    semantic_split_unlock: boundary_ambiguity_is_dominant_after_graph
  m2:
    hypothesis: geometry_temporal_feasibility_before_risk_selection
    first_task: WS-V5-M2-D0-GEOMETRY-FORENSICS-01
    geometry_is_hard_gate: true
    old_validation_parameter_refit_allowed: false
  m3:
    hypothesis: desired_motion_projected_to_physical_constraints
    v4_bspline_role: numerical_parameterization_and_frozen_comparator
    local_residual_default: disabled
  rollback_render_sha_exact: true

