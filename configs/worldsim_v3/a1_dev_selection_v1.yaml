decision:
  comparator: strict_floating_point_order_without_tolerance
  e1:
    lower_is_better: [median, p90]
    support_not_lower: [coverage]
    improvement: all_error_metrics_strictly_lower_and_support_not_lower
    non_degradation: all_error_metrics_not_higher_and_support_not_lower
  e2:
    roles: [boundary-support, high-support]
    lower_is_better: [mean, p90]
    support_not_lower: [coverage]
    improvement: >-
      every role non-degraded and at least one role has all error metrics strictly lower
    non_degradation: every_role_error_not_higher_and_support_not_lower
  appearance:
    lower_is_better:
      - global_lpips
      - boundary_actor_lpips
      - boundary_band_lpips
      - high_actor_lpips
      - high_boundary_lpips
    acceptability: every_metric_not_higher_than_c0
  eligibility: >-
    E1 or E2 improves, the other endpoint is non-degraded, and every frozen
    appearance LPIPS is non-degraded.
  tie_break:
    - improved_primary_endpoint_count_desc
    - global_lpips_asc
    - total_gaussians_asc
    - train_seconds_asc
    - alternative_order_asc
  fallback_variant: c0-off

confirmation_alias_policy:
  logical_matrix_entries: 10
  development_training_runs: 4
  per_confirmation_scene_entries: [c0-off, c1-native, selected_c_star]
  exact_alias_when_selected_is_c0_or_c1: true
  duplicate_training_for_exact_alias: false
  note: >-
    若 C* 等于 C0 或 C1，确认场景仍保留三个逻辑矩阵项，但 C* 项必须登记为同一
    source run/checkpoint 的 exact alias；不把完全相同的重复训练冒充独立变体。
