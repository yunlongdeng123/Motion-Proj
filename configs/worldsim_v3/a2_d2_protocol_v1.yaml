depends_on:
  d1_config: configs/worldsim_v3/a2_d1_v1.yaml
  d1_formal_config: configs/worldsim_v3/a2_d1_formal_v1.yaml
  d1_formal_run: /root/autodl-tmp/runs/worldsim_v3/WS-V3-A2-ACTOR-DENSIFY-01/20260809T085400Z__a2-d1-paired-formal30k-s0-r1
  d1_formal_status: done
