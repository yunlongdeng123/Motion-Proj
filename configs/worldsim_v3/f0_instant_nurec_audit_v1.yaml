standalone_cli_contract:
  python: '>=3.11,<3.12'
  setup: uv sync --frozen
  torch: 2.7.0+cu128
  input_format: NCore V4 .json or .lst
  profiles:
    pa-front: {cameras: 1, frames_per_camera: 18, resolution: [784, 448]}
    pa-multiview: {cameras_allowed: [1, 3, 5], frames_per_camera: 18, resolution: [504, 280]}
    pq-front: {cameras: 1, frames_per_camera: 18, resolution: [784, 448]}
  temporal_sampling:
    frames_per_camera: 18
    maximum_gap_microseconds: 750000
    maximum_chunk_seconds: 13.5
    maximum_chunks: 8
  camera_kernel:
    accepted_type: FTheta
    optional_external_distortion: bivariate_windshield
    pinhole_or_generic_fisheye_accepted: false
  reads:
    rgb: true
    rig_and_world_pose: true
    intrinsics_and_masks: true
    optional_cuboid_tracks: true
    lidar: false
  exports:
    format: PLY
    static_layer: true
    dynamic_layer: false
    sky_cubemap: false
    isp_affine: false
    actor_registry: false
    actor_trajectories: false
    depth_or_point_map: false
  ply_fields:
    - x
    - y
    - z
    - optional_rgb
    - normals
    - rot_0_through_3
    - scale_0_through_2
    - opacity
    - f_dc_0_through_2
    - road_mask
    - sky_mask
  inference_requires_cuda: true
  merge_option_voxelizes_to_target_gaussians_default: 2000000

