faithful_mechanism:
  mask_generation: sam_everything_mode
  mask_association: deva_semionline_cross_view_consistent_short_ids
  identity_encoding_dimension: 16
  identity_sh_degree: 0
  differentiable_rendering: alpha_composited_identity_encoding
  classifier: shared_linear_1x1_identity_to_scene_mask_count
  identity_loss: pixel_cross_entropy_divided_by_log_scene_class_count
  spatial_regularization:
    center_metric: euclidean
    neighbor_count: 5
    sampled_points: 1000
    maximum_candidate_points: 300000
    interval_steps: 2
    divergence: forward_kl_sample_to_neighbor
    includes_self_as_code_topk_semantics: true
    weight: 2.0
  optimizer:
    identity_learning_rate: 0.0025
    classifier_learning_rate: 0.0005
    iterations: 30000
  upstream_training: joint_geometry_appearance_identity
  upstream_declared_limitation: static_scene_no_dynamic_or_time_dependent_update

frozen_base_adaptation:
  declaration: faithful_identity_mechanism_port_under_normative_frozen_base_constraint_not_exact_upstream_reproduction
  freeze_geometry: true
  freeze_appearance: true
  freeze_opacity: true
  freeze_dynamic_actor_poses: true
  learn_identity_encoding_only: true
  learn_shared_classifier_only: true
  preserve_upstream_mask_association: true
  preserve_upstream_identity_dimension: true
  preserve_upstream_2d_loss: true
  preserve_upstream_3d_regularization: true
  forbidden:
    - bayesian_initialization
    - dino_graph
    - anchor
    - unknown_innovation
    - binary_actor_union_as_instance_id_substitute
    - evaluation_target_as_training_label
    - geometry_or_appearance_finetuning

