task_id: N1-EVENT-CUTIN-01
seed: 0
repo_root: /root/autodl-tmp/motion_proj
dataset_root: /root/autodl-tmp/data/nuscenes
cache_dir: /root/autodl-tmp/data/occgs/processed_10Hz/n1_receiver_cutin_v1
run_root: /root/autodl-tmp/runs/event_first/N1-EVENT-CUTIN-01
n0_run: /root/autodl-tmp/runs/event_first/N0-ASSET-01/v71_n0-asset-01__map-v1-3__s0__20260723T232427413355Z__e250cccd
interpolate_n: 4
scene_batch_size: 32
require_clean_git: true

# 所有已人工审核 scene 只用于 calibration，并从第四版 formal evaluation 排除。
calibration:
  second_audit:
    parent_run: /root/autodl-tmp/runs/event_first/N1-EVENT-FULL-01/v71_n1-event-full-01__fulldomain-v1__s0__20260724T081214528945Z__f12c886c
    audit_reject_run: /root/autodl-tmp/runs/event_first/N1-EVENT-FULL-AUDIT-01/v71_n1-event-full-audit-01__human-audit-reject-v1__s0__20260725T083929632491Z__6507cbac
    completed_review_file: /root/autodl-tmp/runs/event_first/N1-EVENT-FULL-01/v71_n1-event-full-01__fulldomain-v1__s0__20260724T081214528945Z__f12c886c/audit/positive_audit_relabelled.jsonl
    completed_review_sha256: ae71b31e02faf1d783c36748e629e85acf32a132f35ce2f98102a5f62201dd05
  third_audit:
    parent_run: /root/autodl-tmp/runs/event_first/N1-EVENT-KINEMATIC-01/v71_n1-event-kinematic-01__kinematic-v1__s0__20260725T092427030639Z__8c2247b6
    audit_reject_run: /root/autodl-tmp/runs/event_first/N1-EVENT-KINEMATIC-AUDIT-01/v71_n1-event-kinematic-audit-01__human-audit-reject-v1__s0__20260725T155754010881Z__4c51f0d9
    completed_review_file: /root/autodl-tmp/runs/event_first/N1-EVENT-KINEMATIC-01/v71_n1-event-kinematic-01__kinematic-v1__s0__20260725T092427030639Z__8c2247b6/audit/review_working.jsonl
    completed_review_sha256: 005cd74b874833808435fd2f47387d1d8e446cdea2d3a5cae6146e34bf331e96
  gates:
    min_third_false_positive_rejections: 12
    min_second_false_positive_rejections: 34
    min_second_true_positive_retentions: 1

evaluation:
  split_name: train
  exclude_scenes:
    - scene-0061
    - scene-0103
    - scene-0553
    - scene-0655
    - scene-0757
    - scene-0796
    - scene-0916
    - scene-1077
    - scene-1094
    - scene-1100
  max_scenes: null

eligibility:
  class_prefix: vehicle.
  min_track_frames: 20
  max_frame_gaps: 0
  min_displacement_m: 5.0

map_matching:
  centerline_resolution_m: 0.5
  nearest_points_k: 16
  max_centerline_distance_m: 3.0
  max_heading_error_deg: 45.0
  heading_score_weight_m_per_rad: 1.0

transition:
  min_stable_source_frames: 10
  min_stable_target_frames: 10
  max_transition_gap_frames: 20
  min_lateral_centerline_shift_m: 1.5
  max_lateral_centerline_shift_m: 6.0
  max_parallel_heading_error_deg: 30.0
  graph_hops_for_shared_corridor: 2
  merge_min_target_incoming_lanes: 2
  negative_window_frames: 30
  positive_exclusion_guard_frames: 5

# 与参考产线规则一致，必须观察“车身在外→进入→持续 1s”，并存在独立接收车。
# 所有物理量仅由 2 Hz keyframe 派生；10 Hz 只用于 token 候选与显示。
cutin:
  annotation_keyframe_stride: 5
  dense_frame_period_s: 0.1
  subject_pre_keyframes: 3
  subject_post_keyframes: 3
  # map token 切换可早于/晚于实际车身越线；只在边界两侧各 4 s 内搜索
  # 连续 2 Hz 状态窗，并限制 outside→inside 的未观测间隔。
  subject_pre_search_keyframes: 9
  subject_post_search_keyframes: 9
  max_entry_transition_duration_s: 4.0
  graph_hops: 2
  max_edge_heading_error_deg: 30.0
  max_edge_endpoint_gap_m: 4.0
  lane_half_width_m: 1.75
  pre_box_outside_clearance_m: 0.10
  post_box_inside_tolerance_m: 0.35
  min_pre_center_outside_keyframes: 2
  min_post_inside_keyframes: 2
  min_pre_center_lateral_m: 1.85
  max_post_center_lateral_m: 0.80
  min_lateral_convergence_m: 1.40
  min_lateral_convergence_consistency: 0.60
  min_pre_side_consistency: 0.6666666667
  max_pre_heading_error_deg: 30.0
  max_post_heading_error_deg: 30.0
  min_settle_duration_s: 1.0
  # nuScenes 相邻 keyframe 时间戳有毫秒级抖动；三帧仍代表名义 1 s。
  timestamp_tolerance_s: 0.02
  min_median_speed_mps: 0.5
  max_receiver_heading_error_deg: 25.0
  max_receiver_centerline_distance_m: 1.50
  min_receiver_pre_keyframes: 2
  min_receiver_post_keyframes: 2
  min_receiver_bumper_gap_m: 0.5
  max_receiver_bumper_gap_m: 40.0
  control_receiver_keyframes: 3
  min_control_receiver_keyframes: 2

kinematics_control:
  annotation_keyframe_stride: 5
  dense_frame_period_s: 0.1
  min_median_speed_mps: 0.5
  max_acceleration_mps2: 12.0
  negative_min_keyframes: 5
  negative_max_centerline_distance_m: 2.0
  negative_max_lateral_span_m: 0.6
  negative_max_heading_error_deg: 20.0

machine_gates:
  min_positive_candidates: 8
  min_negative_windows: 4
  min_same_actor_pairs: 4
  min_candidate_scenes: 5

audit_readiness:
  min_positive_candidates: 1

human_audit:
  audit_prefix: K4
  review_schema: receiver_cutin
  max_items: 40
  sampling: deterministic_sha256_uniform
  blind_order_seed: n1-receiver-cutin-audit-v1
  min_reviewed_items: 8
  min_true_positive_count: 6
  min_true_positive_scenes: 4
  min_precision: 0.80
  min_wilson_95_lower_bound: 0.50
  max_uncertain_fraction: 0.10

stop_rule:
  on_machine_gate_failure: reject_n1_receiver_cutin_pool
  on_audit_ready: await_human_review
  on_no_audit_candidate: reject_n1_receiver_cutin_no_candidate
  never_start_n2_from_this_run: true
  prohibited_recovery:
    - reuse_subject_source_stream_as_target_receiver
    - treat_map_token_change_as_body_lane_entry
    - use_10hz_interpolation_as_physical_measurement
    - shorten_30_frame_negative_window
    - overlap_negative_with_physical_event_window
    - posthoc_threshold_or_scene_selection
    - start_n2_n3_render_or_training
