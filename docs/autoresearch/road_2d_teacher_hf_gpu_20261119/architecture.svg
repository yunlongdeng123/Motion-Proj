<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="432" viewBox="0 0 1240 432" role="img" aria-labelledby="title desc">
<title id="title">二维教师、源级监督和独立VAE控制的数据流</title><desc id="desc">合法观察经四组教师对照得到原始PNG，用于固定域评价与W/K合成。源级1152逐值保留，768和480从原源图独立一次面积采样进入二维候选包。独立VAE不运行UNet，二维包不证明三维训练资格。</desc>
