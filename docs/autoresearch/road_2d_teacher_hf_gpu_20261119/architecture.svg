<g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#e5edf7" text-anchor="middle">
<text x="116" y="85" font-size="18">合法单帧观察</text><text x="116" y="116" font-size="14" fill="#a8bad0">输入隐藏 H · 写许可 W</text>
<text x="385" y="53" font-size="18">固定四组教师对照</text><text x="385" y="82" font-size="13" fill="#bed1e7">整帧 768 · 注意力 LoRA / 基础模型</text><text x="385" y="109" font-size="13" fill="#bed1e7">下部裁片 768×272 · LoRA</text><text x="385" y="136" font-size="13" fill="#bed1e7">整帧 1152×768 · LoRA</text>
<text x="652" y="84" font-size="18">原始生成 PNG</text><text x="652" y="116" font-size="14" fill="#a8bad0">保留生成分辨率</text>
<text x="883" y="53" font-size="16">同域 / 同采样网格</text><text x="883" y="76" font-size="13" fill="#a8bad0">颜色 · 频谱 · 固定统计域</text><text x="883" y="143" font-size="16">固定 W / K 合成</text><text x="883" y="165" font-size="13" fill="#a8bad0">写区外与保留对象精确复制</text>
<text x="1119" y="84" font-size="18">并列审阅与验收</text><text x="1119" y="115" font-size="14" fill="#a8bad0">不自动选优 · 不改三维</text>
<text x="385" y="241" font-size="18">源级教师 RGB</text><text x="385" y="266" font-size="13" fill="#a8bad0">1152 原值保留 · 768 原值保留</text><text x="652" y="241" font-size="17">一次面积采样</text><text x="652" y="266" font-size="13" fill="#a8bad0">各自由源 → 768 / 480</text><text x="999" y="241" font-size="18">二维来源与许可包</text><text x="999" y="266" font-size="13" fill="#a8bad0">20 配对包 · 共同支持分账 · 不接三维</text><text x="770" y="328" font-size="12" fill="#a8bad0">源级 RGB 直接保留，不经降采样</text>
<text x="385" y="372" font-size="17">独立 VAE 重建控制</text><text x="385" y="395" font-size="13" fill="#a8bad0">合法观察，不运行扩散 UNet</text><text x="889" y="372" font-size="17">只评真实可见道路的重建偏差</text><text x="889" y="395" font-size="13" fill="#a8bad0">主合同与追加精度诊断分别记账</text></g>
