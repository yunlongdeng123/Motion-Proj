<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="580" viewBox="0 0 1480 580" role="img" aria-labelledby="title desc">
<title id="title">候选交付：从实际joint贡献校准当前语义a5，QUERY按固定3D行sidecar选行，原v44输入依赖保持</title>
<desc id="desc">原训练BUILD实例mask与原Full5完整joint用于零参数更新的贡献归属，固定3D行sidecar进入只读查询组装；v44原底座保留，先四帧再49双状态诊断；原raw94四项光度失败保留，root结构图检后作为可选候选交付。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#597b8c"/></marker><style>text{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#193b4a}.t{font-size:25px;font-weight:600}.h{font-size:22px;font-weight:600}.s{font-size:17px}.box{fill:white;stroke:#91aebc;stroke-width:1.6}.f{fill:none;stroke:#597b8c;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect width="1480" height="580" fill="#f3f7f9"/><text x="28" y="40" class="t">结构修复候选 · 来源谱系保留，语义5独立校准；0参数更新</text>
<rect class="box" x="30" y="90" width="330" height="150" rx="12"/><text x="195" y="126" text-anchor="middle" class="h">原BUILD输入＋完整Full5</text><text x="195" y="162" text-anchor="middle" class="s">49帧原body mask NN → M5</text><text x="195" y="196" text-anchor="middle" class="s">原static / dynamic完整joint</text>
<rect class="box" x="430" y="90" width="300" height="150" rx="12"/><text x="580" y="126" text-anchor="middle" class="h">实际joint贡献归属</text><text x="580" y="162" text-anchor="middle" class="s">dummy-feature梯度贡献</text><text x="580" y="196" text-anchor="middle" class="s">inside/total &gt; 0.5，total &gt; 0</text>
<rect class="box" x="800" y="90" width="300" height="150" rx="12"/><text x="950" y="126" text-anchor="middle" class="h">固定3D行sidecar</text><text x="950" y="162" text-anchor="middle" class="s">232 static＋120,722 dynamic</text><text x="950" y="196" text-anchor="middle" class="s">绑定同一只读checkpoint</text>
<rect class="box" x="30" y="340" width="330" height="150" rx="12"/><text x="195" y="376" text-anchor="middle" class="h">冻结v44底座</text><text x="195" y="412" text-anchor="middle" class="s">背景 / road gates / C2 / Env</text><text x="195" y="446" text-anchor="middle" class="s">a37保持原仅删除合同</text>
<rect class="box" x="430" y="340" width="300" height="150" rx="12"/><text x="580" y="376" text-anchor="middle" class="h">只读查询组装</text><text x="580" y="412" text-anchor="middle" class="s">按固定3D行sidecar选择</text><text x="580" y="446" text-anchor="middle" class="s">当帧M5 / GT不参与选行</text>
<rect class="box" x="800" y="340" width="300" height="150" rx="12"/><text x="950" y="376" text-anchor="middle" class="h">原生共享深度排序</text><text x="950" y="412" text-anchor="middle" class="s">KEEP / 仅DELETE a37</text><text x="950" y="446" text-anchor="middle" class="s">同次排序，v44原底座冻结</text>
<rect class="box" x="1170" y="340" width="280" height="150" rx="12"/><text x="1310" y="376" text-anchor="middle" class="h">4帧 → 49双状态</text><text x="1310" y="412" text-anchor="middle" class="s">98张实际RGB / 图检</text><text x="1310" y="446" text-anchor="middle" class="s">可选候选，旧v44仍默认</text>
<path class="f" d="M360 165H430"/><path class="f" d="M730 165H800"/><path class="f" d="M950 240V286H580V340"/><path class="f" d="M360 415H430"/><path class="f" d="M730 415H800"/><path class="f" d="M1100 415H1170"/>
<text x="30" y="540" class="s">mask是原BUILD观测，非独立GT；不用alpha改分母。21/25门，raw94四FAIL保留；细节偏软，非逐帧无回退。</text>
</svg>
