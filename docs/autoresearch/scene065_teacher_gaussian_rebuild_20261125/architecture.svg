<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">R9：分离几何占据与RGB监督许可</title>
  <desc id="desc">R8的同一场与完整优化状态继续训练200步。合法实拍背景RGB支持不变；完整背景几何域允许占据学习，8665个未知像素的所有RGB训练及保护权重保持零。原30k与真实车体冻结保留，所有新场参数继续优化。</desc>
