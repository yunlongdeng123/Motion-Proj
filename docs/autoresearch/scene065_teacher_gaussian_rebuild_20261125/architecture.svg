    <path d="M122 310V264H630V224"/><path d="M690 365H715V264H892V224"/>
    <path d="M1000 174H1025V301"/><path d="M785 365H760V244H630V224"/>
  </g>
  <g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#e3edf5" text-anchor="middle">
    <text x="122" y="104" font-size="18">原有输入保持不变</text>
    <text x="122" y="137" font-size="15">完整 RGB 教师 ×3</text>
    <text x="122" y="164" font-size="15">相机 / 红绿橙 masks</text>
    <text x="122" y="191" font-size="15">实拍背景原支持域</text>
    <text x="370" y="104" font-size="18">两类许可独立定义</text>
    <text x="370" y="137" font-size="14">RGB：原合法实拍支持</text>
    <text x="370" y="164" font-size="14">占据：完整背景几何域</text>
    <text x="370" y="191" font-size="14">未知 RGB 仍为 0</text>
    <text x="630" y="104" font-size="18">同一可学习三维场</text>
    <text x="630" y="137" font-size="14">XYZ / scale / quat / α / RGB</text>
    <text x="630" y="164" font-size="15">保留原点与候选 ID</text>
    <text x="630" y="191" font-size="15">按既定生命周期继续学习</text>
    <text x="892" y="104" font-size="18">原生联合渲染</text>
    <text x="892" y="137" font-size="15">冻结保留场 / 三维子核</text>
    <text x="892" y="164" font-size="15">+ 同一新高斯场</text>
    <text x="892" y="191" font-size="15">同一深度排序</text>
