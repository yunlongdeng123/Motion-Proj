    <text x="1150" y="137" font-size="15">实际阶段联合渲染</text>
    <text x="1150" y="164" font-size="15">完整模型 / Adam / RNG</text>
    <text x="1150" y="191" font-size="15">来源绑定 / 独立重载</text>
    <text x="122" y="345" font-size="18">R8 完整 2600 步</text>
    <text x="122" y="377" font-size="15">模型与优化状态接续</text>
    <text x="122" y="401" font-size="14">追加 200 唯一更新</text>
    <text x="515" y="342" font-size="18">原30k与真实车体核心冻结保留</text>
    <text x="515" y="374" font-size="14">仅退出完整背景几何域中的错误子核尾部</text>
