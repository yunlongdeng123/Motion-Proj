<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#45657c"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#203c50;font-size:19px}.small{font-size:16px}rect{rx:10;stroke:#9fb6c5;stroke-width:1.5}.line{stroke:#45657c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="430" fill="#f4f8fb" stroke="none"/><text x="28" y="35" font-weight="bold" font-size="25">阶段二：运动与相机编辑诊断基线</text><rect x="28" y="75" width="320" height="115" fill="#e6eff6"/><text x="48" y="107">同场景原生 30K + 真实传感器</text><text x="48" y="141" class="small">一个动态目标；checkpoint始终只读</text><text x="48" y="171" class="small">31个共用相机时刻，保留物理时间映射</text><rect x="440" y="75" width="320" height="115" fill="#e2f0e9"/><text x="460" y="107">输入条件下的编辑请求</text><text x="460" y="141" class="small">平移 / 复用插入 / 变速 / 转向</text><text x="460" y="171" class="small">相机侧移 / 旋转；碰撞压力单列</text><rect x="850" y="75" width="322" height="115" fill="#e6eff6"/><text x="870" y="107">同一高斯状态的确定性操作</text><text x="870" y="141" class="small">动态时间查询 + 均值与协方差刚性变换</text><text x="870" y="171" class="small">世界米制 ↔ 实际模型坐标；不训练参数</text><rect x="850" y="260" width="322" height="115" fill="#e6eff6"/><text x="870" y="292">保存生成前原生浮点帧</text><text x="870" y="326" class="small">RGB / 深度和 / alpha / 动态贡献</text><text x="870" y="356" class="small">与真实原生通路逐像素核对</text><rect x="440" y="260" width="320" height="115" fill="#fbefd7"/><text x="460" y="292">仅对原位显露区调用固定后端</text><text x="460" y="326" class="small">ProPainter参数不变；保护新位置对象</text><text x="460" y="356" class="small">相机未知域尚未定义时只做原生诊断</text><rect x="28" y="260" width="320" height="115" fill="#fff"/><text x="48" y="292">分开定位失败来源</text><text x="48" y="326" class="small">请求碰撞 / 资产 / 背景 / 视频改坏</text><text x="48" y="356" class="small">保留对象、时序、修补负担；无伪造GT</text><path class="line" d="M348 130H440M760 130H850M1010 190V260M850 315H760M440 315H348"/><text x="28" y="412" class="small">当前新增操作入口尚待真实GPU验证；协议数量不是完成案例数，复用克隆不是独立新资产</text></svg>
