<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#45657c"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;font-size:19px;fill:#203c50}.s{font-size:16px}rect{rx:10;stroke:#9fb6c5;stroke-width:1.5}.a{fill:none;stroke:#45657c;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1200" height="420" fill="#f4f8fb" stroke="none"/><text x="26" y="35" font-size="25" font-weight="bold">扩展真实案例，而非重复计算帧数与种子</text><rect x="26" y="75" width="270" height="115" fill="#e6eff6"/><text x="46" y="106">另30个真实上下文</text><text x="46" y="140" class="s">7个开发 + 23个封存；不改划分</text><text x="46" y="171" class="s">已有3个新场景复用；历史权重保留</text><rect x="350" y="75" width="315" height="115" fill="#e2f0e9"/><text x="370" y="106">CPU三路并行：逐窗真实输入</text><text x="370" y="140" class="s">49帧RGB / LiDAR / 标定 / 位姿</text><text x="370" y="171" class="s">八类物理轨迹请求 + 窗口重新质检</text><rect x="725" y="75" width="447" height="115" fill="#e6eff6"/><text x="745" y="106">分割与目标核验 → 每场景高斯训练一次</text><text x="745" y="140" class="s">原生smoke / 完整恢复 / fresh30K / 每5K保存</text><text x="745" y="171" class="s">当前场景首轮诊断优先；其他准备异步</text><rect x="725" y="255" width="447" height="110" fill="#fbefd7"/><text x="745" y="286">同一基座：八类编辑与固定视频后端</text><text x="745" y="320" class="s">自车变速 / 变道 / 转向；他车再加插入 / 删除</text><text x="745" y="350" class="s">输入、实例、空间、执行、质量分别记账</text><rect x="26" y="255" width="639" height="110" fill="#fff"/><text x="46" y="286">至少109个有效编辑；执行目标128；长期240</text><text x="46" y="320" class="s">分开归因：①实例/轨迹/资产　②背景　③后端改坏</text><text x="46" y="350" class="s">规格与输入材料包不是完成案例；不足就继续补，不用草案凑数</text><path class="a" d="M296 132H350M665 132H725M950 190V255M725 310H665"/><text x="26" y="399" class="s">HorizonForge：论文109编辑；展示32编辑/128视频 ≠ 32独立场景；同协议效果对比仍待执行</text></svg>
