<svg xmlns="http://www.w3.org/2000/svg" width="900" height="662" viewBox="0 0 900 662" role="img" aria-labelledby="title desc">
  <title id="title">世界坐标道路材质场与原生、后训练模型的同输入对照</title>
  <desc id="desc">图像特征通过标定相机与可见性权重绑定到固定道路坐标。图像RGB另存为带曝光的观测。检索提供参考后，原生补全模型和道路LoRA使用相同输入，输出同一表面上的外观纹理。高斯按世界坐标读取纹理，只负责渲染。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#647e86"/></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#233b44}
    .name{font-weight:700;font-size:22px}.detail{font-size:16px;fill:#465c63}.small{font-size:14px;fill:#465c63}
    .arrow{fill:none;stroke:#647e86;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
    rect{stroke-width:1.3}
  </style>
  <rect width="900" height="662" rx="12" fill="#f3f6f4"/>
  <g class="arrow"><path d="M271 61H313"/><path d="M183 96V129"/><path d="M510 96V129"/><path d="M507 207V242"/><path d="M183 207V477"/><path d="M431 320V356"/><path d="M688 320V356"/><path d="M431 435V455H381V477"/><path d="M688 435V455H625V477"/><path d="M439 555V585"/></g>
  <rect x="27" y="24" width="244" height="72" rx="8" fill="#e6edf0" stroke="#9db3bc"/>
  <text x="45" y="55" class="name">真实驾驶图像</text><text x="45" y="80" class="detail">RGB、轮廓与遮挡保护区</text>
  <rect x="314" y="24" width="556" height="72" rx="8" fill="#e6edf0" stroke="#9db3bc"/>
  <text x="334" y="55" class="name">同一份道路几何与相机</text><text x="334" y="80" class="detail">测距支撑的路面坐标、相机标定、位姿及源帧列表</text>
  <rect x="27" y="130" width="244" height="77" rx="8" fill="#e2eee7" stroke="#83aa98"/>
  <text x="45" y="160" class="name">记录成像观测</text><text x="45" y="187" class="detail">线性 RGB、源帧与投影质量</text>
  <rect x="314" y="130" width="556" height="77" rx="8" fill="#e7eef1" stroke="#9db3bc"/>
  <text x="334" y="160" class="name">把图像特征投到真实道路表面</text><text x="334" y="187" class="detail">DINOv3 → 相机投影 → 可见权重融合</text>
  <rect x="314" y="243" width="556" height="77" rx="8" fill="#e2eee7" stroke="#83aa98"/>
  <text x="334" y="273" class="name">世界特征场与道路参考检索</text><text x="334" y="300" class="detail">读取缺口外围与异地路面，输出候选及位置，不读遮盖答案</text>
  <rect x="314" y="357" width="244" height="78" rx="8" fill="#f9edd9" stroke="#c3a47b"/>
  <text x="333" y="388" class="name">原生补全模型</text><text x="333" y="415" class="detail">冻结预训练权重</text>
  <rect x="584" y="357" width="286" height="78" rx="8" fill="#f9edd9" stroke="#c3a47b"/>
  <text x="603" y="388" class="name">道路小样本后训练</text><text x="603" y="415" class="detail">同输入、同噪声，仅训练 LoRA</text>
  <rect x="27" y="478" width="843" height="77" rx="8" fill="#e2eee7" stroke="#83aa98"/>
  <text x="47" y="509" class="name">世界坐标道路材质场</text>
  <text x="47" y="536" class="detail">固定几何 + 参考曝光外观纹理 + 标线外观 + 支持度与来源记录</text>
  <rect x="27" y="586" width="843" height="58" rx="8" fill="#27434c" stroke="#27434c"/>
  <text x="47" y="621" class="name" style="fill:white">按世界坐标取材质 → 固定高斯属性 → 同一 CUDA 深度渲染</text>
  <text x="41" y="355" class="small">观测保留来源</text><text x="41" y="378" class="small">RGB 中含照明与阴影</text><text x="41" y="401" class="small">首轮恢复参考曝光下的外观</text><text x="41" y="424" class="small">真实 PBR 仍需额外约束</text>
</svg>
