<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 344" role="img" aria-labelledby="title desc">
<title id="title">固定道路高斯的材质容量实验</title><desc id="desc">原生二维教师经过固定世界区域划分，三种颜色优化共用同一高斯渲染器，以细节指标和持久资产重载验证。独立世界纹理作为理想教师控制。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8aa8bf"/></marker></defs>
<rect width="1160" height="344" rx="16" fill="#101c2c"/>
<g fill="none" stroke="#8aa8bf" stroke-width="2" marker-end="url(#arrow)"><path d="M208 102H244"/><path d="M432 102H468"/><path d="M698 102H734"/><path d="M924 102H960"/><path d="M584 245V197"/><path d="M358 228L467 170"/></g>
<g stroke="#3e5c76" stroke-width="1.5">
<rect x="20" y="50" width="188" height="112" rx="10" fill="#172b40"/>
<rect x="244" y="50" width="188" height="112" rx="10" fill="#172b40"/>
<rect x="468" y="14" width="230" height="184" rx="10" fill="#15372f" stroke="#53ac92"/>
<rect x="734" y="50" width="190" height="112" rx="10" fill="#172b40"/>
<rect x="960" y="50" width="180" height="112" rx="10" fill="#172b40"/>
<rect x="468" y="246" width="230" height="70" rx="10" fill="#382d46" stroke="#a797ce"/>
<rect x="20" y="228" width="412" height="88" rx="10" fill="#172331"/>
<rect x="734" y="228" width="406" height="88" rx="10" fill="#172331"/>
</g>
<g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle" fill="#e4eef6" font-size="17">
<text x="114" y="82">原生二维教师</text><text x="114" y="109" font-size="14" fill="#acc1d3">1920 × 1280</text><text x="114" y="136" font-size="14">实拍 / 孔洞 / 去影</text>
<text x="338" y="82">监督域与阶段</text><text x="338" y="109" font-size="14">留出对照 / 全标签构建</text><text x="338" y="136" font-size="14" fill="#acc1d3">固定初值与归一化规则</text>
<text x="583" y="43">三种颜色优化</text><text x="583" y="76" font-size="15">共享材质 · RGB 目标</text><text x="583" y="107" font-size="15">共享材质 · 细节目标</text><text x="583" y="138" font-size="15">独立高斯颜色 · 容量控制</text><text x="583" y="178" font-size="13" fill="#b7d9cd">固定预算，不按验证画质选终点</text>
<text x="829" y="82">同一原生高斯渲染器</text><text x="829" y="109" font-size="14">每高斯一个 RGB</text><text x="829" y="136" font-size="14" fill="#acc1d3">道路单独 / 场景联合</text>
<text x="1050" y="82">端点质量评价</text><text x="1050" y="109" font-size="14">高频对应 / 伪纹理</text><text x="1050" y="136" font-size="14">边缘 / 标线 / 覆盖</text>
<text x="583" y="274" font-size="16">独立世界一致理想教师</text><text x="583" y="300" font-size="13" fill="#c6bbdb">12 cm 标线；单独机制控制</text>
<text x="226" y="260" font-size="16">固定高斯资产：可写部分 + 只读部分</text><text x="226" y="289" font-size="13" fill="#acc1d3">冻结几何 / 足迹 / α / 可写范围 / 其他场景</text>
<text x="937" y="260" font-size="16">保存 → 公共加载器重载 → 五视角复验</text><text x="937" y="289" font-size="13" fill="#acc1d3">86 / 110 / 134 / 179 / 198；保护车辆逐像素验证</text>
</g></svg>
