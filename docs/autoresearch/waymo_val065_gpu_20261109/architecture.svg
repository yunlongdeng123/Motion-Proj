<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#547486"/></marker></defs><rect width="1160" height="390" rx="16" fill="#f5f8fb"/><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#244452"><text x="580" y="35" font-size="23" font-weight="700">从驾驶观测到原生重建与车辆删除</text><g stroke="#9fb9c9" stroke-width="1.5"><rect x="25" y="133" width="180" height="100" rx="12" fill="#e6eff7"/><rect x="245" y="133" width="180" height="100" rx="12" fill="#e6eff7"/><rect x="465" y="133" width="180" height="100" rx="12" fill="#e6eff7"/><rect x="695" y="65" width="210" height="90" rx="12" fill="#e6eff7"/><rect x="945" y="65" width="190" height="90" rx="12" fill="#e6eff7"/><rect x="695" y="220" width="210" height="100" rx="12" fill="#e2f1ea"/><rect x="945" y="220" width="190" height="100" rx="12" fill="#fff0d9"/></g><g font-size="19" font-weight="700"><text x="115" y="166">真实驾驶观测</text><text x="335" y="166">构建帧准备</text><text x="555" y="166">原生完整场景</text><text x="800" y="99">无编辑直通</text><text x="1040" y="99">V1 重建参照</text><text x="800" y="255">共享归属与道路</text><text x="1040" y="255">统一深度渲染</text></g><g font-size="15"><text x="115" y="193">图像、标定、测距</text><text x="115" y="217">相机与车辆轨迹</text><text x="335" y="193">分割、时钟、实测点</text><text x="335" y="217">159 帧；留出 40 帧</text><text x="555" y="193">从头训练 10,000 步</text><text x="555" y="217">静态 / 动态 / 环境</text><text x="800" y="129">直接调用原渲染器</text><text x="1040" y="129">不接收编辑请求</text><text x="800" y="281">跨帧归属、世界道路</text><text x="800" y="306">静态不透明度交接</text><text x="1040" y="281">KEEP：保留白车</text><text x="1040" y="306">DELETE：删除白车</text><text x="580" y="363">两条通路共享原生训练结果；编辑通路加入持久三维表示，不拼接输出图像。留出帧不参与拟合。</text></g></g><g stroke="#547486" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M205 183H245"/><path d="M425 183H465"/><path d="M645 183H665V110H695"/><path d="M645 183H665V270H695"/><path d="M905 110H945"/><path d="M905 270H945"/></g></svg>
