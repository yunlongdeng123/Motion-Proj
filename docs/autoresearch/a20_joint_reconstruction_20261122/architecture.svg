<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="570" viewBox="0 0 1250 570"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#90cbdf"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#edf5ff}.b{fill:#19374a;stroke:#6096b1;stroke-width:2;rx:12}.g{fill:#19463d;stroke:#68c7a5;stroke-width:2;rx:12}.o{fill:#483e2b;stroke:#d9b871;stroke-width:2;rx:12}.h{font-size:21px;font-weight:600}.s{font-size:16px}.l{stroke:#90cbdf;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1250" height="570" fill="#0b1723"/><text x="26" y="41" font-size="29" font-weight="700">a20：同一对象高斯场联合重建</text>
<rect class="b" x="26" y="85" width="270" height="110"/><text class="h" x="44" y="119">旧 a20：清洁后 8,925颗</text><text class="s" x="44" y="150">已有观测与外观；按置信度约束</text><text class="s" x="44" y="178">允许更新，不锁旧成像贡献</text>
<rect class="b" x="26" y="238" width="270" height="110"/><text class="h" x="44" y="272">TRELLIS：原生410,080颗</text><text class="s" x="44" y="304">完整车辆先验；不重采样</text><text class="s" x="44" y="332">允许适配真实形状与材质</text>
<rect class="g" x="358" y="150" width="304" height="135"/><text class="h" x="378" y="186">共同初始化：419,005颗</text><text class="s" x="378" y="221">同一 a20 对象坐标 · 来源记录</text><text class="s" x="378" y="254">统一位置 / 尺度 / 旋转 / Alpha / 颜色</text><path class="l" d="M296 140H327V190H358"/><path class="l" d="M296 293H327V249H358"/>
<rect class="g" x="727" y="150" width="493" height="135"/><text class="h" x="748" y="186">同一个高斯场联合优化</text><text class="s" x="748" y="221">实际三维渲染 → RGB / 轮廓 / 可信测距</text><text class="s" x="748" y="254">深度冲突与冗余清退 · 其它车辆保护</text><path class="l" d="M662 218H727"/>
<rect class="o" x="358" y="375" width="304" height="125"/><text class="h" x="378" y="409">真实观测 + 多视角先验</text><text class="s" x="378" y="443">实拍 RGB／轮廓／可信测距</text><text class="s" x="378" y="478">未观测部分保形，避免少帧压扁</text><path class="l" d="M662 436H704V272H727"/>
<rect class="b" x="727" y="375" width="493" height="125"/><text class="h" x="748" y="409">单一 a20 持久资产 → 与道路联合渲染</text><text class="s" x="748" y="443">灰模先验收；保存、重载与跨帧统一使用</text><text class="s" x="748" y="478">初期道路、相机、轨迹、其它车辆全部冻结</text><path class="l" d="M974 285V375"/><text class="s" x="26" y="544">实拍训练帧：86 / 110；生成网络冻结。旧固定贡献方案保留为历史对照。</text></svg>
