<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 425"><defs><marker id="a" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7" fill="#64748b"/></marker></defs><style>text{font:18px 'Microsoft YaHei',Arial;fill:#173047}.s{font-size:15px;fill:#52697c}rect{fill:#edf3f8;stroke:#91a8bd;rx:12}.l{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style><rect width="1280" height="425" fill="white" stroke="none"/><rect x="20" y="145" width="210" height="105"/><text x="38" y="178">原始观测与轨迹</text><text x="38" y="207" class="s">199帧LiDAR / RGB</text><text x="38" y="233" class="s">a6可见证据；未知单列</text><rect x="270" y="145" width="235" height="105"/><text x="288" y="178">冻结车辆几何先验</text><text x="288" y="207" class="s">5976实测＋1527生成patch</text><text x="288" y="233" class="s">同一PVD；几何不更新</text><rect x="545" y="145" width="290" height="105"/><text x="563" y="178">编辑条件下局部三维替换</text><text x="563" y="207" class="s">a37→a6轨迹体积 / 旧静态清理</text><text x="563" y="233" class="s">固定道路＋保留车支撑保护</text><rect x="875" y="145" width="380" height="105"/><text x="893" y="178">新a6＋道路＋其他对象联合深度排序</text><text x="893" y="207" class="s">只拟合a6已知可见RGB：1000步</text><text x="893" y="233" class="s">输出删除a37后的多视角场景</text><path d="M230 197H270M505 197H545M835 197H875" class="l"/><rect x="270" y="20" width="565" height="80"/><text x="288" y="52">无编辑：保留原Native渲染路径</text><text x="288" y="80" class="s">保真由明确分支设计保证，不计作重建算法收益</text><path d="M125 145V60H270" class="l"/><rect x="270" y="305" width="565" height="90"/><text x="288" y="338">未知下部没有可验证RGB，不使用a37作为颜色真值</text><text x="288" y="368" class="s">道路生成先验、车辆纹理先验仍未实现；灰色部分属于推断</text><path d="M388 250V305" class="l"/></svg>