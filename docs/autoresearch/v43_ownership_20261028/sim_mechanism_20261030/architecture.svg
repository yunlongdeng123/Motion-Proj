<rect x="35" y="395" width="980" height="230" rx="12" fill="#e0f1ea" stroke="#a5bfce" stroke-width="1.5"/>
<text x="525" y="435" font-size="24" font-weight="bold">适配器 → 当前 GN11 原生整场景重建</text>
<text x="525" y="472" font-size="19">保留完整 mask alpha 内外域、静态 RGB / 寿命 / 速度、LiDAR 深度等继承约束</text>
<g fill="#f1faf5" stroke="#a5bfce" stroke-width="1.5">
<rect x="60" y="505" width="285" height="90" rx="9"/>
<rect x="380" y="505" width="285" height="90" rx="9"/>
<rect x="700" y="505" width="285" height="90" rx="9"/>
</g>
<text x="202" y="541" font-size="21" font-weight="bold">static</text><text x="202" y="574" font-size="18">同一完整训练器</text>
<text x="522" y="541" font-size="21" font-weight="bold">dynamic</text><text x="522" y="574" font-size="18">原生种子 / 增密 / optimizer</text>
<text x="842" y="541" font-size="21" font-weight="bold">environment</text><text x="842" y="574" font-size="18">本轮重建共同训练</text>
<rect x="1075" y="395" width="490" height="230" rx="12" fill="#eee5f3" stroke="#a5bfce" stroke-width="1.5"/>
<text x="1320" y="435" font-size="24" font-weight="bold">独立评价</text>
<text x="1320" y="481" font-size="19">原位残留 / 新位完整 / 保留域 / 深度</text>
<text x="1320" y="516" font-size="19">错深度 / mixed / 无对应 / 缺测分开</text>
<text x="1320" y="551" font-size="19">world road receiver + vehicle effect</text>
<text x="1320" y="586" font-size="18">shadow差分仅关联效果代理，非纯阴影GT</text>
<rect x="35" y="690" width="980" height="155" rx="12" fill="#eaf1f7" stroke="#a5bfce" stroke-width="1.5"/>
<text x="525" y="730" font-size="24" font-weight="bold">真实 smoke：保存 / 评价 / 完整恢复 / 下一阶段入口</text>
<text x="525" y="773" font-size="19">参数、optimizer、sampler、RNG、静态 / 动态 / 环境状态核验</text>
<text x="525" y="808" font-size="19">已通过约10分钟及恢复入口；正式10K；额外开销单列</text>
<rect x="1075" y="690" width="490" height="155" rx="12" fill="#eaf1f7" stroke="#a5bfce" stroke-width="1.5"/>
<text x="1320" y="730" font-size="24" font-weight="bold">实际分支编辑 baseline</text>
<text x="1320" y="773" font-size="19">none / delete / shift / rotate + FP32分量</text>
<text x="1320" y="808" font-size="19">不把原分支当 owner GT 或V43成功</text>
<g fill="none" stroke="#527c91" stroke-width="2.5">
