<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="m0-title m0-desc">
<title id="m0-title">V43 M0：实际重建与独立表面编辑参考</title>
<desc id="m0-desc">普通程序车道路灯光世界生成受限观测，含显式登记的oracle body和sky masks；这些白名单输入通过适配器进入当前GN11整场景训练的静态动态环境分支。完整保存恢复和下一阶段真实渲染之后，分支编辑baseline与隔离的独立表面深度编辑参考比较。r2十六帧数据验证已报告通过，GPU smoke已通过，不宣称方法成功。GT不在每颗Gaussian，shadow差分不是纯阴影GT。</desc>
<rect width="1600" height="980" fill="#f5f9fc"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203f51" text-anchor="middle">
<text x="35" y="45" text-anchor="start" font-size="29" font-weight="bold">V43 M0：受限观测 → 当前代码真实重建 → 完整恢复 → 独立核验</text>
<text x="35" y="82" text-anchor="start" font-size="20">r2 16帧数据验证已报告通过；GPU smoke已通过。程序车仅用于接口 / 机制验证。</text>
<g fill="#fff1dc" stroke="#a5bfce" stroke-width="1.5">
<rect x="35" y="125" width="440" height="215" rx="12"/>
<rect x="535" y="125" width="480" height="215" rx="12"/>
<rect x="1075" y="125" width="490" height="215" rx="12" fill="#eee5f3"/>
</g>
<text x="255" y="163" font-size="23" font-weight="bold">独立普通世界</text>
<text x="255" y="207" font-size="19">程序车 / 道路 / 灯光 / 相机轨迹</text>
<text x="255" y="240" font-size="19">对象 / 表面 / 干预参数可重放</text>
<text x="255" y="273" font-size="19">不手造主评测的错误 Gaussian</text>
<text x="255" y="306" font-size="18">不承诺指定自然污染必出现</text>
<text x="775" y="163" font-size="23" font-weight="bold">登记的训练白名单</text>
<text x="775" y="207" font-size="19">16帧 RGB / 有限稀疏 LiDAR</text>
<text x="775" y="240" font-size="19">标定 / 时间 / oracle body+sky masks</text>
<text x="775" y="273" font-size="19">ideal tracks；非可部署预测管线</text>
<text x="775" y="306" font-size="18">body mask不含车辆投影阴影</text>
<text x="1320" y="163" font-size="23" font-weight="bold">隔离的独立参考</text>
<text x="1320" y="207" font-size="19">mesh / surface IDs / depth / visibility</text>
<text x="1320" y="240" font-size="19">世界干预的 delete / shift / rotate</text>
<text x="1320" y="273" font-size="19">surface GT ≠ 每颗 Gaussian GT</text>
<text x="1320" y="306" font-size="18">不进入训练或实际方法调优</text>
<g fill="none" stroke="#527c91" stroke-width="2.5">
<path d="M475 220H535"/>
<path d="M255 125V105H1320V125"/>
<path d="M775 340V395"/>
<path d="M1320 340V395"/>
</g>
