<rect x="35" y="890" width="1530" height="60" rx="10" fill="#fff" stroke="#a5bfce" stroke-width="1.5"/>
<text x="800" y="929" font-size="21">先看一次实际重建是否暴露污染，再3–5机制场景；无完整GT的真实三场景不由人工 / subagent补成完美真值。</text>
</g></svg>
