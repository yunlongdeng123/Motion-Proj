<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" role="img" aria-labelledby="title desc">
<title id="title">HorizonForge 场景来源追踪</title><desc id="desc">演示编号与原视频生成候选，结合场景清单和实际记录，经像素与来源核对形成已确认映射及数据缺口。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#506784"/></marker></defs>
<rect width="1100" height="240" rx="16" fill="#f3f7fc"/>
<g stroke="#bdcde0" fill="white" stroke-width="1.5"><rect x="18" y="56" width="205" height="110" rx="9"/><rect x="290" y="56" width="205" height="110" rx="9"/><rect x="562" y="56" width="235" height="110" rx="9"/><rect x="864" y="56" width="218" height="110" rx="9"/></g>
<g stroke="#506784" stroke-width="2" marker-end="url(#a)"><path d="M223 111H288"/><path d="M495 111H560"/><path d="M797 111H862"/></g>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#213953" text-anchor="middle"><text x="120" y="91" font-size="20">演示编号与原视频</text><text x="120" y="124" font-size="15">11 场景 / 32 个任务</text><text x="392" y="91" font-size="20">清单生成候选 context</text><text x="392" y="124" font-size="15">清单版本与编号规则分开</text><text x="679" y="91" font-size="20">记录来源与像素核对</text><text x="679" y="124" font-size="15">CRC / context / 多帧图像</text><text x="974" y="91" font-size="20">映射与数据缺口</text><text x="974" y="124" font-size="15">已有数据 / 需补齐的场景</text><text x="550" y="207" font-size="15" fill="#5b708b">图像匹配用于确认数据来源，不作为编辑真值或方法效果评价。</text></g></svg>
