<svg viewBox="0 0 1320 390" role="img" aria-label="原始观测到候选证据到归属暂缓和独立验证，无反馈标签循环" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#547188"/></marker></defs><g font-family="Microsoft YaHei,sans-serif" fill="#17384b" text-anchor="middle"><g fill="#e9f1f8" stroke="#8daabe"><rect x="10" y="20" width="270" height="340" rx="12"/><rect x="340" y="20" width="300" height="340" rx="12" fill="#e6f4ec"/><rect x="700" y="20" width="270" height="340" rx="12" fill="#f2eafb"/><rect x="1030" y="20" width="280" height="340" rx="12" fill="#fff3dc"/></g><g font-size="23" font-weight="700"><text x="145" y="58">① 原始观测</text><text x="490" y="58">② 独立证据</text><text x="835" y="58">③ 高斯归属暂缓</text><text x="1170" y="58">④ 原生验收</text></g><g stroke="#9bb3c2" fill="white"><rect x="30" y="88" width="230" height="64" rx="6"/><rect x="30" y="186" width="230" height="64" rx="6"/><rect x="360" y="88" width="260" height="64" rx="6"/><rect x="360" y="186" width="260" height="64" rx="6"/><rect x="720" y="88" width="230" height="64" rx="6"/><rect x="720" y="186" width="230" height="64" rx="6"/><rect x="1050" y="88" width="240" height="64" rx="6"/><rect x="1050" y="186" width="240" height="64" rx="6"/></g><g font-size="18"><text x="145" y="115">RGB / LiDAR / 相机</text><text x="145" y="141">目标轨迹 / 伪掩码</text><text x="145" y="213">原世界表面跨时刻对应</text><text x="145" y="239">曝光与遮挡核对</text><text x="490" y="115">车身 / 近地阴影证据</text><text x="490" y="141">原始暗化＋随动见证</text><text x="490" y="213">背景正见证 / 冲突</text><text x="490" y="239">缺测保持缺测</text><text x="835" y="115">冻结高斯 alpha × T</text><text x="835" y="141">语义 / 身份 / effect 分开</text><text x="835" y="213">目标 U / 阴影 U / 混合 U</text><text x="835" y="239">逐行原因与来源</text><text x="1170" y="115">只去 car / U / car＋U</text><text x="1170" y="141">同帧原生 RGB 与 alpha</text><text x="1170" y="213">残影＋背景损伤核验</text><text x="1170" y="239">AI 初审 ≠ 人工真值</text></g><g stroke="#547188" stroke-widt