<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#55778b"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial;fill:#183a4c;font-size:19px}.h{font-size:22px;font-weight:bold}.b{fill:#e9f1f8;stroke:#9bb6c8;stroke-width:1.5}.p{fill:#fff3dc;stroke:#b9b2a1}.g{fill:#e0f1e8;stroke:#a7c9b8}.line{fill:none;stroke:#55778b;stroke-width:2;marker-end:url(#a)}</style>
<rect class="b" x="16" y="26" width="308" height="402" rx="10"/><text class="h" x="40" y="62">固定输入与独立真值</text>
<rect class="b" x="36" y="88" width="268" height="98" rx="6"/><text x="50" y="120">原生整场景重建 · 10K</text><text x="50" y="153">static / dynamic / E 冻结</text>
