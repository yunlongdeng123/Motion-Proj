<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1390" viewBox="0 0 1800 1390" role="img" aria-labelledby="data-title data-desc"><title id="data-title">V43 Revision5：普通世界、真实重建污染与隔离GT评价</title><desc id="data-desc">普通车辆道路灯光世界分别生成受限RGB稀疏LiDAR观测和独立表面对象干预真值。合法观测输入当前重建代码实际训练，自然污染审计后进入V43共享联合模型。独立深度表面与编辑配对只进入隔离评价和明确的真值辅助M1M2诊断，不进入部署特征。先一个最小场景真实重建，再三至五机制场景，再小规模学习批量；人工扰动仅辅助，不承诺自然出现指定错误。阴影是world道路receiver与vehicle effect owner，车有减车无不是纯阴影GT。</desc><rect width="1800" height="1390" fill="#f5f9fc"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203f51"><text x="40" y="48" text-anchor="start" font-size="30" font-weight="bold" fill="#203f51">V43 数据路线：普通世界 → 受限观测 → 实际重建 → 联合分解 → 独立核验</text><text x="40" y="84" text-anchor="start" font-size="21" font-weight="normal" fill="#203f51">GT 在世界表面、对象与干预结果上；每颗 Gaussian 不保证唯一对应。评价真值与部署输入分路保存。</text><rect x="40" y="125" width="1720" height="250" rx="11" fill="#fff1dc" stroke="#a5bfce" stroke-width="1.5" data-module="world"/><text x="900.0" y="158" text-anchor="middle" font-size="25" font-weight="bold" fill="#203f51">① 独立仿真世界：现成 / 程序化普通车辆、道路、材质、灯光</text><text x="900.0" y="189" text-anchor="middle" font-size="20" font-weight="normal" fill="#203f51">同一世界状态、相机与时刻；保存资产、坐标系、对象 / 表面 ID、轨迹和干预参数</text><rect x="65" y="215" width="900" height="130" rx="11" fill="#fff9ef" stroke="#a5bfce" stroke-width="1.5"/><text x="515.0" y="248" text-anchor="middle" font-size="22" font-weight="bold" fill="#203f51">普通观察条件，不手造主评测的错误 Gaussian</text><text x="515.0" y="279" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">有限视角 / 遮挡 / 稀疏度 / 时间轨迹按合同登记</text><text x="515.0" y="306" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">不承诺真实训练一定产生漏归属、错深度或混合</text><rect x="1010" y="215" width="725" height="130" rx="11" fill="#f5ebf8" stroke="#a5bfce" stroke-width="1.5"/><text x="1372.5" y="248" text-anchor="middle" font-size="22" font-weight="bold" fill="#203f51">独立真值分支</text><text x="1372.5" y="279" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">世界表面 / 对象 / 深度 / 可见性 + 对象级编辑干预</text><text x="1372.5" y="306" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">完整网格与稠密 GT 不进入部署输入</text><rect x="40" y="430" width="1120" height="445" rx="11" fill="#e0f1ea" stroke="#a5bfce" stroke-width="1.5" data-module="reconstruction"/><text x="600.0" y="463" text-anchor="middle" font-size="25" font-weight="bold" fill="#203f51">② 受限观测与当前重建代码：主污染来源</text><text x="600.0" y="494" text-anchor="middle" font-size="19" font-weight="normal" fill="#203f51">不以干净表面直接构造 Gaussian；实际训练、checkpoint、损失和预算可追溯</text><rect x="65" y="535" width="1070" height="115" rx="11" fill="#f1faf5" stroke="#a5bfce" stroke-width="1.5"/><text x="600.0" y="568" text-anchor="middle" font-size="22" font-weight="bold" fill="#203f51">受限 RGB + 稀疏 LiDAR + 相机 / 时间</text><text x="600.0" y="599" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">已有跟踪 / mask / 语义也只作为带噪观测证据</text><text x="600.0" y="626" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">输入清单与评价 GT 清单分开，禁止测试答案泄漏</text><rect x="65" y="700" width="1070" height="145" rx="11" fill="#f1faf5" stroke="#a5bfce" stroke-width="1.5"/><text x="600.0" y="733" text-anchor="middle" font-size="22" font-weight="bold" fill="#203f51">当前重建代码真实训练 → 自然污染审计</text><text x="600.0" y="764" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保留初始化、活跃约束、seed、采样、更新与适配差异</text><text x="600.0" y="790" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">错深度 / mixed / 无对应 / 缺测分别检查；原分支与网页语义不是 GT</text><text x="600.0" y="816" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">人工标签 / 参数扰动只作辅助机制控制，独立记账</text><polyline points="515,345 515,405 600,405 600,430" stroke="#348767" stroke-width="3" fill="none"/><path d="M0 0L-12 -6L-12 6Z" transform="translate(600 430) rotate(90.0)" fill="#348767"/><polyline points="600,650 600,700" stroke="#348767" stroke-width="3" fill="none"/><path d="M0 0L-12 -6L-12 6Z" transform="translate(600 700) rotate(90.0)" fill="#348767"/><text x="815" y="684" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">实际训练</text><rect x="40" y="930" width="1120" height="250" rx="11" fill="#e0f1ea" stroke="#a5bfce" stroke-width="1.5" data-module="v43"/><text x="600.0" y="963" text-anchor="middle" font-size="25" font-weight="bold" fill="#203f51">③ V43：共享证据、多头联合状态与按请求决策</text><text x="600.0" y="994" text-anchor="middle" font-size="19" font-weight="normal" fill="#203f51">部署只接合法观测、真实重建、来源账本与可计算贡献</text><rect x="65" y="1030" width="745" height="120" rx="11" fill="#f1faf5" stroke="#a5bfce" stroke-width="1.5"/><text x="437.5" y="1063" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">归属 + 几何 / mixed + effect + 不确定性</text><text x="437.5" y="1094" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">场景判断不接收 delete / shift / rotate</text><text x="437.5" y="1119" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">请求只进决策；有预算修复、拆分、新增或暂缓</text><rect x="835" y="1030" width="300" height="120" rx="11" fill="#eaf1f7" stroke="#a5bfce" stroke-width="1.5"/><text x="985.0" y="1063" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">输出与来源</text><text x="985.0" y="1094" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">三维状态 / 编辑结果</text><text x="985.0" y="1119" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">参数、动作、资源记录</text><polyline points="600,845 600,930" stroke="#348767" stroke-width="3" fill="none"/><path d="M0 0L-12 -6L-12 6Z" transform="translate(600 930) rotate(90.0)" fill="#348767"/><text x="805" y="909" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">真实重建与证据</text><polyline points="810,1090 835,1090" stroke="#348767" stroke-width="3" fill="none"/><path d="M0 0L-12 -6L-12 6Z" transform="translate(835 1090) rotate(0.0)" fill="#348767"/><rect x="1220" y="430" width="540" height="750" rx="11" fill="#eee5f3" stroke="#a5bfce" stroke-width="1.5" data-module="evaluation"/><text x="1490.0" y="463" text-anchor="middle" font-size="25" font-weight="bold" fill="#203f51">④ 隔离 GT 参考与评价</text><text x="1490.0" y="494" text-anchor="middle" font-size="20" font-weight="normal" fill="#203f51">真值不进入部署特征</text><rect x="1245" y="535" width="490" height="170" rx="11" fill="#faf5fc" stroke="#a5bfce" stroke-width="1.5"/><text x="1490.0" y="568" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">独立表面 / 深度 / 对象参考</text><text x="1490.0" y="599" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">对应须核对深度、表面与可见性</text><text x="1490.0" y="624" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">αT × 像素语义只是派生责任</text><text x="1490.0" y="649" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">错深度 / mixed / 无对应 / 缺测分开</text><text x="1490.0" y="674" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">不强迫每颗 Gaussian 贴硬标签</text><rect x="1245" y="750" width="490" height="170" rx="11" fill="#faf5fc" stroke="#a5bfce" stroke-width="1.5"/><text x="1490.0" y="783" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">独立配对编辑与 shadow4</text><text x="1490.0" y="814" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">删车 / 横移 / 转向后重新渲染世界</text><text x="1490.0" y="839" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">world road receiver + vehicle effect</text><text x="1490.0" y="864" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">体可见与投影可分别控制</text><text x="1490.0" y="889" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">有车减无车不是纯阴影 GT</text><rect x="1245" y="965" width="490" height="185" rx="11" fill="#faf5fc" stroke="#a5bfce" stroke-width="1.5"/><text x="1490.0" y="998" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">表面、编辑结果与公平性核验</text><text x="1490.0" y="1029" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">残留 / 深度 / 保留域 / 完成率</text><text x="1490.0" y="1054" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">M1/M2 真值辅助参考，非数学上界</text><text x="1490.0" y="1079" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">列额外信息、容量与优化预算</text><text x="1490.0" y="1104" text-anchor="middle" font-size="17" font-weight="normal" fill="#203f51">完整干净参考不作公平方法胜利</text><polyline points="1372,345 1372,405 1490,405 1490,430" stroke="#9a71a5" stroke-width="3" fill="none"/><path d="M0 0L-12 -6L-12 6Z" transform="translate(1490 430) rotate(90.0)" fill="#9a71a5"/><polyline points="1490,705 1490,750" stroke="#9a71a5" stroke-width="3" fill="none"/><path d="M0 0L-12 -6L-12 6Z" transform="translate(1490 750) rotate(90.0)" fill="#9a71a5"/><polyline points="1490,920 1490,965" stroke="#9a71a5" stroke-width="3" fill="none"/><path d="M0 0L-12 -6L-12 6Z" transform="translate(1490 965) rotate(90.0)" fill="#9a71a5"/><polyline points="1135,1090 1220,1090 1245,1090" stroke="#66879a" stroke-width="3" fill="none"/><path d="M0 0L-12 -6L-12 6Z" transform="translate(1245 1090) rotate(0.0)" fill="#66879a"/><text x="1190" y="1067" text-anchor="middle" font-size="16" font-weight="normal" fill="#203f51">核验</text><rect x="40" y="1220" width="1720" height="100" rx="11" fill="#eaf1f7" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1253" text-anchor="middle" font-size="25" font-weight="bold" fill="#203f51">执行门槛：1 个最小场景实际重建 → 3–5 机制场景 → 小学习 / 批量</text><text x="900.0" y="1284" text-anchor="middle" font-size="19" font-weight="normal" fill="#203f51">训练 GT 仅监督训练分区；测试 GT 不调优实际方法。真实三场景无完整 GT；场景 1 仅开发 / 推理，不训练可迁移模块。</text><text x="40" y="1355" text-anchor="start" font-size="18" font-weight="normal" fill="#5b778a">本图为协议设计：自然污染不足就报告不足；人工 / subagent 参考不是完美 GT；运行完成须有独立凭据。</text></g></svg>
