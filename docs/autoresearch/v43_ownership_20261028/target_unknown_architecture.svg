<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="950" viewBox="0 0 1360 950"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#637f91"/></marker></defs><rect width="1360" height="950" fill="#f7fafc"/><text x="680" y="43" font-family="Microsoft YaHei, sans-serif" font-size="31" text-anchor="middle" fill="#244454">V43：目标专属 unknown 与背景保护</text><text x="680" y="81" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#244454">共同验收：原位无车辆残影；正确背景与其他车辆保持稳定</text><rect x="30" y="110" width="1300" height="92" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="680.0" y="142" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" fill="#244454">输入：目标实例 / 原49帧重建与实测掩码 / 完整199帧RGB、LiDAR、相机</text><text x="680.0" y="173" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" fill="#244454">保留四种信息：语义类别、实例归属、运动状态、证据状态</text><rect x="30" y="244" width="410" height="509" rx="9" fill="#fff1d9" stroke="#abc2cf" stroke-width="1.5"/><text x="235" y="283" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#244454">① 两种归属证据</text><rect x="475" y="244" width="410" height="509" rx="9" fill="#e1f2e9" stroke="#abc2cf" stroke-width="1.5"/><text x="680" y="283" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#244454">② 目标专属 unknown</text><rect x="920" y="244" width="410" height="509" rx="9" fill="#fff1d9" stroke="#abc2cf" stroke-width="1.5"/><text x="1125" y="283" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#244454">③ 原生分解与背景修复</text><rect x="50" y="312" width="370" height="100" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="235.0" y="344" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">原生 alpha×T 反向归因</text><text x="235.0" y="374" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">删除动态资产后，追踪静态贡献</text><path d="M235 413L235 438" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="439" width="370" height="100" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="235.0" y="471" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">车身与真实背景分别积累</text><text x="235.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">深度、跨帧支持、其他物体排除</text><path d="M235 540L235 565" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="566" width="370" height="145" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="235.0" y="598" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">逐表面重复可见性</text><text x="235.0" y="627" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">≥3次清晰观测，跨度≥0.5秒</text><text x="235.0" y="656" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">缺测与语义冲突保留</text><rect x="495" y="312" width="370" height="100" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="680.0" y="344" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">可靠车辆 / 可靠背景</text><text x="680.0" y="374" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">区分空间身份与车辆外观污染</text><path d="M680 413L680 438" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><rect x="495" y="439" width="370" height="100" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="680.0" y="471" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">目标相关不确定集合</text><text x="680.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">混合支撑单列；全局unknown不删除</text><path d="M680 540L680 565" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><rect x="495" y="566" width="370" height="145" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="680.0" y="598" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">学习保留权重与局部外观</text><text x="680.0" y="627" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">权重不是已校准的身份概率</text><text x="680.0" y="656" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">原语义与动静态分支分别保存</text><rect x="940" y="312" width="370" height="100" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="1125.0" y="344" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">实测背景补层 / 受限表面插值</text><text x="1125.0" y="374" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">坐标来自真实世界表面</text><path d="M1125 413L1125 438" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><rect x="940" y="439" width="370" height="100" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="1125.0" y="471" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">联合更新保留率、DC与补层</text><text x="1125.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#244454">对照：固定剥离集合后补景</text><path d="M1125 540L1125 565" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><rect x="940" y="566" width="370" height="145" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="1125.0" y="598" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">分区域保护与原生RGB检查</text><text x="1125.0" y="627" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">车旁邻域 / 其他车辆 / 远处背景</text><text x="1125.0" y="656" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="middle" fill="#244454">目前仍有残影，尚未通过验收</text><path d="M235 202L235 244" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><path d="M440 500L475 500" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><path d="M885 500L920 500" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><path d="M1125 753L1125 796" fill="none" stroke="#637f91" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="797" width="1300" height="107" rx="9" fill="#e7eff6" stroke="#abc2cf" stroke-width="1.5"/><text x="680.0" y="829" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#244454">输出：同一HTML帧轴上的原生RGB、真实高斯参数、背景补层与证据着色</text><text x="680.0" y="861" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#244454">默认无编辑仍走原V1；原模型不覆盖。下一关：混合高斯的空间支撑拆分。</text></svg>