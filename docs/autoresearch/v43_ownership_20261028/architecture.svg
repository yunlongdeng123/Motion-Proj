<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#54758a"/></marker></defs><rect width="1500" height="850" fill="#f7fbfd"/><g font-family="Microsoft YaHei,sans-serif" fill="#254757"><text x="40" y="44" font-size="28" font-weight="bold">V43：先核验归属与结构，再处理静态混合车影</text><g fill="#e2edf5" stroke="#95afbf"><rect x="40" y="80" width="1420" height="75" rx="12"/><rect x="1065" y="180" width="395" height="90" rx="12"/></g><g text-anchor="middle" font-size="21"><text x="750" y="111">原生V1 / V42冻结场景 + 真实RGB / LiDAR / 相机 / 目标跟踪 + 编辑请求</text><text x="750" y="140" font-size="18">无编辑时保留原生通路；新局部车身作为独立结构组验收</text><text x="1262" y="216">无编辑 → V1原生直接输出</text><text x="1262" y="246" font-size="18">实际渲染对照差0；不替换原资产</text></g><g stroke="#95afbf"><rect x="40" y="210" width="690" height="430" rx="12" fill="#e3f2eb"/><rect x="770" y="310" width="690" height="330" rx="12" fill="#fff1db"/></g><g font-size="23" font-weight="bold"><text x="70" y="250">① 语义 / 实例 / 运动 / 证据分开保存</text><text x="800" y="350">② 编辑结构与可见性诊断</text></g><g fill="white" stroke="#98b3c4"><rect x="70" y="280" width="630" height="80" rx="9"/><rect x="70" y="400" width="630" height="80" rx="9"/><rect x="70" y="520" width="630" height="90" rx="9"/><rect x="800" y="380" width="630" height="85" rx="9"/><rect x="800" y="505" width="630" height="105" rx="9"/><rect x="40" y="700" width="1420" height="110" rx="12"/></g><g font-size="21" text-anchor="middle"><text x="385" y="313">实拍19类预测 + 原生alpha*T逐行支持</text><text x="385" y="344" font-size="18">保留原动静态批次；car × static不等于纯车辆几何</text><text x="385" y="432">低置信 / 混合支撑 / 轮廓内外带 → unknown</text><text x="385" y="462" font-size="18">3 / 5 / 8像素可调；源点和标签来源可点选核对</text><text x="385" y="552">车辆外观与背景几何冲突 → 人工核验</text><text x="385" y="584" font-size="18">后续学习分解；不直接整颗移动或删除混合高斯</text><text x="1115" y="413">实测点局部车身 + 刚体轨迹 + 原静态层</text><text x="1115" y="445" font-size="18">同帧控制1m / 3m偏移与转向，原始参数不写回</text><text x="1115" y="537">独立alpha → 合成贡献 / 可见比例 → 固定视频后端</text><text x="1115" y="569" font-size="18">只改密度的因果对照；静态抑制暴露副作用</text><text x="1115" y="595" font-size="18">车底与阴影暂缓；补全、unknown学习尚未完成</text><text x="750" y="739">③ 同一场景HTML：原生通路 / RGB / alpha / 语义与unknown / 实际几何 / 诊断对照</text><text x="750" y="774" font-size="19">目标橙框、邻车蓝框；原生与ProPainter分别查看；第二场景停10K、第三场景后续暂缓</text></g><g stroke="#54758a" stroke-width="2.4" fill="none" marker-end="url(#a)"><path d="M385 155V203 M1262 155V173 M1115 270V303 M385 360V394 M385 480V514 M1115 465V499 M730 555H793 M385 640V693 M1115 640V693"/></g></g></svg>