<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="770" viewBox="0 0 1500 770"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#54758a"/></marker></defs><rect width="1500" height="770" fill="#f7fbfd"/><g font-family="Microsoft YaHei,sans-serif" fill="#254757"><text x="45" y="43" font-size="27" font-weight="bold">V43：语义归属诊断与车辆结构约束，接回同一工作台</text><g fill="#e2edf5" stroke="#95afbf"><rect x="45" y="80" width="1410" height="85" rx="12"/><rect x="45" y="658" width="1410" height="83" rx="12"/></g><g font-size="22" text-anchor="middle"><text x="750" y="116">只读 V42 30K：原始 RGB / 真实 LiDAR / 已核验目标实例 / 相机 / ActorTrack</text><text x="750" y="145" font-size="19">保留原有 static/dynamic 批次与 checkpoint；语义和实例分别记录，unknown 不强制归背景</text></g><g stroke="#95afbf"><rect x="45" y="205" width="675" height="400" rx="12" fill="#e3f2eb"/><rect x="780" y="205" width="675" height="400" rx="12" fill="#fff1db"/></g><g font-size="23" font-weight="bold"><text x="75" y="247">① 完整语义与跨分支归属证据</text><text x="810" y="247">② 车辆局部坐标结构实验</text></g><g fill="white" stroke="#98b3c4"><rect x="75" y="275" width="615" height="80" rx="9"/><rect x="75" y="385" width="615" height="80" rx="9"/><rect x="75" y="495" width="615" height="80" rx="9"/><rect x="810" y="275" width="615" height="80" rx="9"/><rect x="810" y="385" width="615" height="80" rx="9"/><rect x="810" y="495" width="615" height="80" rx="9"/></g><g font-size="21" text-anchor="middle"><text x="382" y="306">冻结 SegFormer：19 类 + unknown</text><text x="382" y="336" font-size="18">保留概率、原始观测帧、噪声与类别映射</text><text x="382" y="416">原生 alpha*T 可见贡献 → 逐行语义证据</text><text x="382" y="446" font-size="18">前向 alpha 与反向累计闭合；完整行数，不按网页抽样推断</text><text x="382" y="526">目标车支持 / 后方背景 / 混合支撑</text><text x="382" y="556" font-size="18">同像素实测车身深度复核；尚不整颗硬删 unknown</text><text x="1117" y="306">带来源的车身实测点 → Actor 局部种子</text><text x="1117" y="336" font-size="18">同一实例、49帧刚体轨迹；保留测量行和原始框外种子</text><text x="1117" y="416">几何 + RGB + 稀疏深度优化</text><text x="1117" y="446" font-size="18">观测锚点、0.25m 位移预算、尺度增长与外扩包络约束</text><text x="1117" y="526">fresh / 完整恢复 smoke → 正式 fresh10K</text><text x="1117" y="556" font-size="18">49帧评价、原动态分支对照、固定时刻与幅度编辑检查</text><text x="750" y="692">③ 每个场景一个 HTML：RGB / 语义 / 实际贡献 / 三维点 / 蓝色邻车框 / 训练节点</text><text x="750" y="721" font-size="18">先核验归属与结构，再比较分阶段补全和联合修复；当前不宣称联合优越或质量通过</text></g><g stroke="#54758a" stroke-width="2.3" fill="none" marker-end="url(#a)"><path d="M382 165V200 M1117 165V200 M382 355V379 M382 465V489 M1117 355V379 M1117 465V489 M382 605V651 M1117 605V651"/></g></g></svg>