<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="940" viewBox="0 0 1360 940"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#68879b"/></marker></defs><rect width="1360" height="940" fill="#f6fafc"/><text x="680" y="45" font-size="30" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">V43 阶段简报：身份、结构与显露背景</text><rect x="30" y="85" width="1300" height="95" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="680.0" y="117" font-size="22" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">输入：原49帧高斯与目标跟踪；199帧RGB / LiDAR / 相机证据</text><text x="680.0" y="149" font-size="22" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">原V1无编辑直出保留；四字段分存：语义、实例、运动、证据</text><rect x="30" y="225" width="410" height="505" rx="9" fill="#fff1d9" stroke="#adc3d1" stroke-width="1.5"/><text x="235" y="266" font-size="22" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">① 证据与目标专属unknown</text><rect x="475" y="225" width="410" height="505" rx="9" fill="#e0f2e9" stroke="#adc3d1" stroke-width="1.5"/><text x="680" y="266" font-size="22" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">② 联合分解与背景补层</text><rect x="920" y="225" width="410" height="505" rx="9" fill="#fff1d9" stroke="#adc3d1" stroke-width="1.5"/><text x="1125" y="266" font-size="22" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">③ 原生渲染与分项验收</text><rect x="50" y="297" width="370" height="96" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="235.0" y="329" font-size="21" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">alpha×T追踪目标相关贡献</text><text x="235.0" y="360" font-size="21" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">保留全量行ID与原始分支</text><path d="M235 393L235 423" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="423" width="370" height="110" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="235.0" y="455" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">实测背景与前景分别取证</text><text x="235.0" y="485" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">缺测、冲突、混合支撑单列</text><text x="235.0" y="515" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">static批次 ≠ 世界静止</text><path d="M235 533L235 563" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="563" width="370" height="128" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="235.0" y="595" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">新增审计：原static含运动</text><text x="235.0" y="625" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">下一关：同一世界表面支持</text><text x="235.0" y="655" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">不把深度相符直接当身份</text><rect x="495" y="297" width="370" height="96" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="680.0" y="329" font-size="21" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">目标相关保留率＋DC适配</text><text x="680.0" y="360" font-size="21" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">可选：按时刻贡献历史门控</text><path d="M680 393L680 423" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><rect x="495" y="423" width="370" height="110" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="680.0" y="455" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">世界静止的实测背景补层</text><text x="680.0" y="485" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">可选：受限表面插值</text><text x="680.0" y="515" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">可选：低权重视频伪监督</text><path d="M680 533L680 563" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><rect x="495" y="563" width="370" height="128" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="680.0" y="595" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">联合学习与固定剥离对照</text><text x="680.0" y="625" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">保护邻近背景、远处、其他车</text><text x="680.0" y="655" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">学习权重尚不是身份概率</text><rect x="940" y="297" width="370" height="96" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="1125.0" y="329" font-size="21" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">同一HTML帧轴：RGB＋3D</text><text x="1125.0" y="360" font-size="21" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">实际保留率、几何与证据</text><path d="M1125 393L1125 423" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><rect x="940" y="423" width="370" height="110" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="1125.0" y="455" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">逐项验收：残影 / 背景 / 结构</text><text x="1125.0" y="485" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">新相机压力测试另存</text><text x="1125.0" y="515" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">生成教师不充当实测GT</text><path d="M1125 533L1125 563" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><rect x="940" y="563" width="370" height="128" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="1125.0" y="595" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">目前：结构改善，残影未净</text><text x="1125.0" y="625" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">三候选供下一轮验证</text><text x="1125.0" y="655" font-size="20" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">本轮封存，不新增实验</text><path d="M235 180L235 225" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><path d="M440 478L475 478" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><path d="M885 478L920 478" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><path d="M1125 730L1125 777" fill="none" stroke="#68879b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="777" width="1300" height="116" rx="9" fill="#e7eff7" stroke="#adc3d1" stroke-width="1.5"/><text x="680.0" y="809" font-size="21" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">独立车辆编辑支线：Actor局部刚体资产 → 内部 / 邻近外域 / 其余外域opacity监督 → 转向覆盖与边缘检查</text><text x="680.0" y="840" font-size="21" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" fill="#234657">保留原V1；不采用固定密度×2作默认。后续冻结规则跨场景，再验收联合优化是否优于强流水线。</text></svg>