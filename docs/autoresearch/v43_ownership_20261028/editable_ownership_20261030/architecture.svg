<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1710" viewBox="0 0 1800 1710" role="img" aria-labelledby="title desc"><title id="title">V43：身份与表示修复，保留 V1 原生通路与 V42 完整编辑架构</title><desc id="desc">RGB、LiDAR、相机与轨迹进入时空编辑、身份与表示修复、原生渲染及按需生成三个大组件。V43 分开语义、归属、运动与证据，检测混合支撑，保留两侧子高斯局部拟合，并分离道路接收面上的车辆阴影效应。无编辑请求保留 V1 原生输出。</desc><rect width="1800" height="1710" fill="#f5f9fc"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203f51"><text x="40" y="48" text-anchor="start" font-size="32" font-weight="bold" fill="#203f51">V43：身份 + 表示修复 → 时空编辑 → 背景修复与按需生成</text><text x="40" y="84" text-anchor="start" font-size="21" font-weight="normal" fill="#203f51">保留 V1 原生无编辑通路与 V42 三大组件；分类、几何修复、阴影解耦和生成收益分别验证。</text><rect x="40" y="115" width="710" height="90" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="395.0" y="147" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">只读原始高斯 / checkpoint / 已登记身份</text><text x="395.0" y="176" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保留原参数、来源索引与 parent–child lineage</text><rect x="1310" y="115" width="450" height="90" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="147" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">V1 无编辑：原生通路</text><text x="1535.0" y="176" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">已有零差对照；修复分支单独验收</text><polyline points="750,160 1310,160" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1310 160) rotate(0.0)" fill="#66879a"/><text x="1030" y="146" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">无编辑请求直通</text><rect x="40" y="235" width="1720" height="72" rx="11" fill="#eaf1f7" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="267" text-anchor="middle" font-size="23" font-weight="bold" fill="#203f51">输入：全片段 RGB / LiDAR / 相机 / 时间 / 跟踪；请求：对象、轨迹、资产、操作区间</text><polyline points="395,205 395,235" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(395 235) rotate(90.0)" fill="#66879a"/><rect x="40" y="345" width="450" height="1030" rx="11" fill="#fff1dc" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="377" text-anchor="middle" font-size="24" font-weight="bold" fill="#203f51">① 时空编辑与对象管理</text><text x="265.0" y="406" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">继承 V42 接口 · 保留已有操作身份</text><polyline points="265.0,307 265.0,345" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(265.0 345) rotate(90.0)" fill="#66879a"/><rect x="540" y="345" width="720" height="1030" rx="11" fill="#e0f1ea" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="377" text-anchor="middle" font-size="24" font-weight="bold" fill="#203f51">② 身份与表示修复</text><text x="900.0" y="406" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">V43 主线 · 多头归属与可修复表示</text><polyline points="900.0,307 900.0,345" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900.0 345) rotate(90.0)" fill="#66879a"/><rect x="1310" y="345" width="450" height="1030" rx="11" fill="#fff1dc" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="377" text-anchor="middle" font-size="24" font-weight="bold" fill="#203f51">③ 渲染、背景修复与生成</text><text x="1535.0" y="406" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">继承 V42 大架构 · 生成按需调用</text><polyline points="1535.0,307 1535.0,345" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1535.0 345) rotate(90.0)" fill="#66879a"/><rect x="65" y="445" width="400" height="130" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="477" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">已有实例 / 连续轨迹</text><text x="265.0" y="506" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">黑车 A、白车 B、道路表面 R</text><text x="265.0" y="532" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">对象 owner 不因停车或遮挡改变</text><text x="265.0" y="558" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">Actor 与自车时钟分别求值</text><rect x="65" y="625" width="400" height="112" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="657" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">编辑请求与保护范围</text><text x="265.0" y="686" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">移动 / 删除 / 插入 / 转向</text><text x="265.0" y="712" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">目标、时刻、姿态与保留对象</text><rect x="65" y="787" width="400" height="138" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="819" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">编辑状态与可见性</text><text x="265.0" y="848" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">原位显露、新遮挡与目标范围</text><text x="265.0" y="874" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">稳定 owner ≠ 当前可见性</text><text x="265.0" y="900" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">置信随证据变化，身份不逐帧跳变</text><rect x="65" y="975" width="400" height="138" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="1007" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">按目标查询 1 / 0 / U</text><text x="265.0" y="1036" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">1 属于目标；0 确认非此目标</text><text x="265.0" y="1062" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">U 为证据不足、冲突或混合待拆</text><text x="265.0" y="1088" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">static 分支 ≠ 语义背景</text><text x="265" y="1200" text-anchor="middle" font-size="20" font-weight="bold" fill="#203f51">已有：对象编辑与原生基座</text><text x="265" y="1233" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">待实现：完整跨分支归属与表示修复</text><text x="265" y="1266" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">原始资产与所有历史对照保留</text><polyline points="265,575 265,625" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(265 625) rotate(90.0)" fill="#66879a"/><polyline points="265,737 265,787" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(265 787) rotate(90.0)" fill="#66879a"/><polyline points="265,925 265,975" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(265 975) rotate(90.0)" fill="#66879a"/><rect x="565" y="435" width="670" height="108" rx="11" fill="#f1faf5" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="467" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②a-1 跨分支证据与来源账本</text><text x="900.0" y="496" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">实测来源 / 多帧关联 / 深度轨迹 / αT 贡献</text><text x="900.0" y="522" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">剥离后重算真实贡献；保留原行号与 parent–child lineage</text><rect x="565" y="567" width="670" height="190" rx="11" fill="#e9f5ef" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="599" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②a-2 分类器合同：四字段 + mixed / effect</text><text x="900.0" y="628" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">semantic：车辆 / 道路等；instance / surface owner：A / R</text><text x="900.0" y="654" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">motion binding：Actor 局部 / world；evidence / confidence</text><text x="900.0" y="680" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">support type：pure / spatial mixed / unknown</text><text x="900.0" y="706" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">effect type：shadow 等；effect owner 与 receiver 分开</text><text x="900.0" y="732" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">已有规则候选；多头可学习分类器尚未实现</text><rect x="565" y="781" width="670" height="164" rx="11" fill="#fff2dd" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="813" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②a-3 先查空间相容性；不足仍 unknown</text><text x="900.0" y="842" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">pure → 归属；mixed 先查父椭球与实测支持相容性</text><text x="900.0" y="868" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">相容再双侧 split/refit；不相容先校几何 / 重建表面</text><text x="900.0" y="894" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">shadow → world 道路 receiver 上的 car-owner 外观效应</text><text x="900.0" y="920" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">no-edit 保真不代表分离；须查 after 真实透射下两侧</text><rect x="565" y="969" width="670" height="112" rx="11" fill="#fff2dd" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1001" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②a-4 首轮强控制 → 再做分类器迁移</text><text x="900.0" y="1030" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">归属理想 / 证据候选上界 + mixed 检测 → split × shadow4</text><text x="900.0" y="1056" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">再用外部数据训练；场景 1 只做推理 / 开发诊断</text><rect x="565" y="1105" width="670" height="112" rx="11" fill="#fff2dd" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1137" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②a-5 独立验收：归属、几何、外观与编辑收益</text><text x="900.0" y="1166" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">R2 ROI 白底 ≠ unknown SH 涂白 ≠ 学习分类 ≠ 编辑收益</text><text x="900.0" y="1192" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">尚无人工 GT；不宣称 oracle 完成或人工验收通过</text><rect x="565" y="1241" width="670" height="108" rx="11" fill="#f4f1e9" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1273" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②b 显露背景修复 · 保留 V42 后续组件</text><text x="900.0" y="1302" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保留正确表面 + 污染修正 + 有来源补层</text><text x="900.0" y="1328" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">分步 / assignment-only / joint / joint-detached 配对</text><polyline points="900,543 900,567" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 567) rotate(90.0)" fill="#66879a"/><polyline points="900,757 900,781" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 781) rotate(90.0)" fill="#66879a"/><polyline points="900,945 900,969" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 969) rotate(90.0)" fill="#66879a"/><polyline points="900,1081 900,1105" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 1105) rotate(90.0)" fill="#66879a"/><polyline points="900,1217 900,1241" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 1241) rotate(90.0)" fill="#66879a"/><rect x="1335" y="445" width="400" height="130" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="477" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">同一时刻求值与原生合成</text><text x="1535.0" y="506" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">稳定 owner + 当前编辑变换</text><text x="1535.0" y="532" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">RGB / 深度 / 实例与真实贡献</text><text x="1535.0" y="558" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">无编辑保留 V1 直接输出</text><rect x="1335" y="625" width="400" height="112" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="657" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">三维结果与分量诊断</text><text x="1535.0" y="686" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">车身 / 道路 receiver / effect</text><text x="1535.0" y="712" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">高斯层与原环境泄漏分开核对</text><rect x="1335" y="787" width="400" height="138" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="819" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">背景修复与按需生成</text><text x="1535.0" y="848" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">指定显露区域 → 固定 ProPainter</text><text x="1535.0" y="874" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">三维原生结果与生成结果分别保存</text><text x="1535.0" y="900" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">生成图不转成独立实测或标签</text><rect x="1335" y="975" width="400" height="138" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="1007" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">分项验收与强对照</text><text x="1535.0" y="1036" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">归属 / mixed / 几何 / shadow4</text><text x="1535.0" y="1062" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保留区损伤、时序稳定与资源</text><text x="1535.0" y="1088" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">相同证据、容量、更新及后端</text><text x="1535" y="1200" text-anchor="middle" font-size="20" font-weight="bold" fill="#203f51">输出：可追溯三维状态 + 编辑视频</text><text x="1535" y="1233" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">补全与联合收益均须实验成立</text><text x="1535" y="1266" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">现有诊断产物不等于方法验收</text><polyline points="1535,575 1535,625" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1535 625) rotate(90.0)" fill="#66879a"/><polyline points="1535,737 1535,787" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1535 787) rotate(90.0)" fill="#66879a"/><polyline points="1535,925 1535,975" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1535 975) rotate(90.0)" fill="#66879a"/><polyline points="490,665 540,665" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(540 665) rotate(0.0)" fill="#66879a"/><polyline points="1260,665 1310,665" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1310 665) rotate(0.0)" fill="#66879a"/><rect x="40" y="1415" width="1720" height="112" rx="11" fill="#eaf1f7" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1447" text-anchor="middle" font-size="23" font-weight="bold" fill="#203f51">贯穿机制：稳定 owner 与逐时刻可见性 / 置信分开</text><text x="900.0" y="1476" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">世界 / Actor 局部状态保留来源、冲突和时间；混合分裂保存两侧子高斯、原父高斯与局部 refit 记录。</text><text x="900.0" y="1502" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">正序 / 逆序 / 跳帧检查证据复用；剥离后新显露贡献可追查，不用自己的输出循环生成 GT。</text><polyline points="265,1415 265,1375" stroke="#66879a" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(265 1375) rotate(-90.0)" fill="#66879a"/><polyline points="900,1415 900,1375" stroke="#66879a" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 1375) rotate(-90.0)" fill="#66879a"/><polyline points="1535,1415 1535,1375" stroke="#66879a" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1535 1375) rotate(-90.0)" fill="#66879a"/><rect x="40" y="1560" width="1720" height="72" rx="11" fill="#ffffff" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1592" text-anchor="middle" font-size="24" font-weight="bold" fill="#203f51">共同验收：归属精度与覆盖 → 表示与几何 → 背景 / 阴影 → 编辑视频质量与成本</text><text x="40" y="1663" text-anchor="start" font-size="17" font-weight="normal" fill="#5b778a">蓝：继承组件　绿：身份合同　黄：表示修复 / 强控制　灰：后续补全；双侧 refit 已有短探针，空间分离尚未证实。</text><text x="40" y="1692" text-anchor="start" font-size="17" font-weight="normal" fill="#5b778a">本轮证据：三锚点原生短探针 + 200 次 child 参数更新；分类器未训练，人工 GT 与编辑收益验收仍未完成。</text></g></svg>