<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1710" viewBox="0 0 1800 1710" role="img" aria-labelledby="title desc"><title id="title">V43：共享证据编码与局部可编辑联合分解，保留 V1 与 V42 架构</title><desc id="desc">三个大组件保留时空编辑、局部可编辑联合分解、原生渲染与按需生成。场景观测经过共享编码，语义实例运动证据多头、几何修正、混合支撑与两侧拆分及新表面、车辆关联阴影效应并列耦合，可联合优化与分阶段训练。删除和移动指令只进入编辑决策，允许保持原状或暂缓；unknown 高召回候选不是操作集合。环境参数冻结但回填贡献随透明度变化；保存高斯颜色、透明度、环境回填贡献与合成结果，另存环境输出，并统一常量底色诊断。机制验收从三至五个可控场景及理想上界开始，再扩大候选并小规模学习，场景一只用于推理与开发。</desc><rect width="1800" height="1710" fill="#f5f9fc"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203f51"><text x="40" y="48" text-anchor="start" font-size="32" font-weight="bold" fill="#203f51">V43：共享证据 → 局部可编辑联合分解 → 按请求编辑与修复</text><text x="40" y="84" text-anchor="start" font-size="21" font-weight="normal" fill="#203f51">联合建模归属、几何、混合支撑与阴影；可分阶段训练，场景判断不接收删除 / 移动指令。</text><rect x="40" y="115" width="710" height="90" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="395.0" y="147" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">只读原始高斯 / checkpoint / 已登记身份</text><text x="395.0" y="176" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保留原参数、来源索引与 parent–child lineage</text><rect x="1310" y="115" width="450" height="90" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="147" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">V1 无编辑：原生通路</text><text x="1535.0" y="176" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保留已有零差对照；修复另行验收</text><polyline points="750,160 1310,160" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1310 160) rotate(0.0)" fill="#66879a"/><text x="1030" y="146" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">无编辑请求直通</text><rect x="40" y="235" width="1720" height="72" rx="11" fill="#eaf1f7" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="267" text-anchor="middle" font-size="23" font-weight="bold" fill="#203f51">场景证据输入：全片段 RGB / LiDAR / 相机 / 时间 / 跟踪 / 原始高斯（不含编辑指令）</text><polyline points="395,205 395,235" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(395 235) rotate(90.0)" fill="#66879a"/><rect x="40" y="345" width="450" height="1030" rx="11" fill="#fff1dc" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="377" text-anchor="middle" font-size="24" font-weight="bold" fill="#203f51">① 时空编辑与对象管理</text><text x="265.0" y="406" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">继承 V42 接口 · 保留用户允许域</text><polyline points="265.0,307 265.0,345" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(265.0 345) rotate(90.0)" fill="#66879a"/><rect x="540" y="345" width="720" height="1030" rx="11" fill="#e0f1ea" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="377" text-anchor="middle" font-size="24" font-weight="bold" fill="#203f51">② 局部可编辑联合分解</text><text x="900.0" y="406" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">V43 主线 · 共享证据与耦合表示</text><polyline points="900.0,307 900.0,345" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900.0 345) rotate(90.0)" fill="#66879a"/><rect x="1310" y="345" width="450" height="1030" rx="11" fill="#fff1dc" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="377" text-anchor="middle" font-size="24" font-weight="bold" fill="#203f51">③ 渲染、背景修复与生成</text><text x="1535.0" y="406" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">继承 V42 大架构 · 生成按需调用</text><polyline points="1535.0,307 1535.0,345" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1535.0 345) rotate(90.0)" fill="#66879a"/><rect x="65" y="445" width="400" height="130" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="477" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">已有实例 / 连续轨迹</text><text x="265.0" y="506" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">黑车 A、白车 B、道路表面 R</text><text x="265.0" y="532" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">稳定 owner ≠ 当前运动 / 可见性</text><text x="265.0" y="558" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">Actor 与自车时钟分别求值</text><rect x="65" y="625" width="400" height="112" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="657" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">编辑请求与用户允许域</text><text x="265.0" y="686" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">删除 / 移动 / 插入 / 转向</text><text x="265.0" y="712" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">目标、时刻、姿态与保留对象</text><rect x="65" y="787" width="400" height="138" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="819" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">高召回 unknown 候选与记账</text><text x="265.0" y="848" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">候选由场景证据产生，非操作集合</text><text x="265.0" y="874" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">候选内背景误召回仅记账</text><text x="265.0" y="900" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">候选扩大不扩大用户允许操作域</text><rect x="65" y="975" width="400" height="138" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="265.0" y="1007" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">按目标查询 1 / 0 / U</text><text x="265.0" y="1036" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">1 属于目标；0 确认非此目标</text><text x="265.0" y="1062" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">U 为证据不足、冲突或混合</text><text x="265.0" y="1088" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">原 static 分支 ≠ 语义背景</text><text x="265" y="1200" text-anchor="middle" font-size="20" font-weight="bold" fill="#203f51">已有：对象编辑与原生基座</text><text x="265" y="1233" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">候选召回、编辑授权与决策分开</text><text x="265" y="1266" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">模型允许保持原状或暂缓操作</text><polyline points="265,575 265,609" stroke="#66879a" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(265 609) rotate(90.0)" fill="#66879a"/><polyline points="265,925 265,975" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(265 975) rotate(90.0)" fill="#66879a"/><rect x="565" y="435" width="670" height="108" rx="11" fill="#f1faf5" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="467" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②a 共享场景证据编码与来源账本</text><text x="900.0" y="496" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">unknown 候选 + 周围可靠点 / 多帧关联 / 深度 / αT</text><text x="900.0" y="522" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">不接收 delete / shift；保留原行号与 parent–child lineage</text><rect x="565" y="567" width="670" height="382" rx="11" fill="#e9f5ef" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="599" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②b 联合分解：共享潜变量与一致性约束</text><text x="900.0" y="628" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">四类输出相互约束；可联合优化，也可分阶段训练</text><rect x="580" y="650" width="310" height="122" rx="11" fill="#f1faf5" stroke="#a5bfce" stroke-width="1.5"/><text x="735.0" y="682" text-anchor="middle" font-size="17" font-weight="bold" fill="#203f51">语义 / 实例 / 运动 / 证据多头</text><text x="735.0" y="711" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">semantic；instance / surface owner</text><text x="735.0" y="734" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">Actor 局部 / world；置信与冲突</text><text x="735.0" y="757" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">纯支撑 / mixed / unknown</text><rect x="910" y="650" width="310" height="122" rx="11" fill="#fff2dd" stroke="#a5bfce" stroke-width="1.5"/><text x="1065.0" y="682" text-anchor="middle" font-size="18" font-weight="bold" fill="#203f51">几何修正与局部重拟合</text><text x="1065.0" y="711" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">椭球位置、尺度与实测支持对齐</text><text x="1065.0" y="734" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">归属、可见性与几何联合约束</text><text x="1065.0" y="757" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">不预设“几何已正确”</text><rect x="580" y="798" width="310" height="130" rx="11" fill="#fff2dd" stroke="#a5bfce" stroke-width="1.5"/><text x="735.0" y="830" text-anchor="middle" font-size="18" font-weight="bold" fill="#203f51">mixed / 两侧拆分 / 新表面</text><text x="735.0" y="859" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">保留两侧子高斯与 parent lineage</text><text x="735.0" y="882" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">必要时补可追溯的新表面</text><text x="735.0" y="905" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">修几何、拆分与新增可共同求解</text><rect x="910" y="798" width="310" height="130" rx="11" fill="#fff2dd" stroke="#a5bfce" stroke-width="1.5"/><text x="1065.0" y="830" text-anchor="middle" font-size="18" font-weight="bold" fill="#203f51">车辆关联 shadow effect</text><text x="1065.0" y="859" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">car effect owner ≠ 道路 receiver</text><text x="1065.0" y="882" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">道路几何与车辆关联外观分离</text><text x="1065.0" y="905" text-anchor="middle" font-size="15" font-weight="normal" fill="#203f51">与归属、几何及支撑共同建模</text><polyline points="900,543 900,567" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 567) rotate(90.0)" fill="#66879a"/><polyline points="890,711 910,711" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(910 711) rotate(0.0)" fill="#66879a"/><polyline points="910,731 890,731" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(890 731) rotate(180.0)" fill="#66879a"/><polyline points="890,856 910,856" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(910 856) rotate(0.0)" fill="#66879a"/><polyline points="910,876 890,876" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(890 876) rotate(180.0)" fill="#66879a"/><polyline points="727,772 727,798" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(727 798) rotate(90.0)" fill="#66879a"/><polyline points="743,798 743,772" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(743 772) rotate(-90.0)" fill="#66879a"/><polyline points="1057,772 1057,798" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1057 798) rotate(90.0)" fill="#66879a"/><polyline points="1073,798 1073,772" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(1073 772) rotate(-90.0)" fill="#66879a"/><rect x="565" y="975" width="670" height="112" rx="11" fill="#e9f5ef" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1007" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②c 编辑决策：联合状态 + 请求 + 用户允许域</text><text x="900.0" y="1036" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保持 / 改归属 / 修几何 / 拆分 / 新增 / 暂缓</text><text x="900.0" y="1062" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">仅此处接收编辑指令；证据不足可不修改模型</text><polyline points="900,949 900,975" stroke="#66879a" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 975) rotate(90.0)" fill="#66879a"/><polyline points="465,682 515,682 515,1031 565,1031" stroke="#b5843b" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(565 1031) rotate(0.0)" fill="#b5843b"/><rect x="492" y="745" width="40" height="26" fill="#f5f9fc"/><text x="512" y="765" text-anchor="middle" font-size="16" font-weight="normal" fill="#986f31">请求</text><circle cx="515" cy="856" r="6" fill="#f5f9fc"/><polyline points="465,856 535,856 535,489 565,489" stroke="#348767" stroke-width="2.5" fill="none"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(565 489) rotate(0.0)" fill="#348767"/><rect x="565" y="1111" width="670" height="114" rx="11" fill="#fff2dd" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1143" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②d 验收路线：先机制上界，再小规模学习</text><text x="900.0" y="1172" text-anchor="middle" font-size="16" font-weight="normal" fill="#203f51">3–5 可控场景 → 理想归属 + 理想表示修复上界</text><text x="900.0" y="1193" text-anchor="middle" font-size="16" font-weight="normal" fill="#203f51">→ 候选扩大 → 小规模学习</text><text x="900.0" y="1214" text-anchor="middle" font-size="16" font-weight="normal" fill="#203f51">场景 1 仅推理 / 开发，不训练可迁移模块</text><rect x="565" y="1249" width="670" height="100" rx="11" fill="#f4f1e9" stroke="#a5bfce" stroke-width="1.5"/><text x="900.0" y="1281" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">②e 显露背景修复 · 保留 V42 后续组件</text><text x="900.0" y="1310" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保留正确表面 + 污染修正 + 有来源补层</text><text x="900.0" y="1336" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">分步 / assignment-only / joint / joint-detached 配对</text><polyline points="900,1249 900,1225" stroke="#66879a" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/><path d="M0 0L-11 -5L-11 5Z" transform="translate(900 1225) rotate(-90.0)" fill="#66879a"/><rect x="1335" y="445" width="400" height="130" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="477" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">同相机 / 时刻 / 请求配对</text><text x="1535.0" y="506" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">原生 C = C_G + (1−α)E</text><text x="1535.0" y="532" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">E 参数冻结 ≠ 回填贡献固定</text><text x="1535.0" y="558" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">环境不可当 car；无编辑直通 V1</text><rect x="1335" y="625" width="400" height="112" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="657" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">三维结果与四分量诊断</text><text x="1535.0" y="686" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">保存 C_G / α / (1−α)E / C</text><text x="1535.0" y="712" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">另存 E；统一常量底色诊断</text><rect x="1335" y="787" width="400" height="138" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="819" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">背景修复与按需生成</text><text x="1535.0" y="848" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">指定显露区域 → 固定 ProPainter</text><text x="1535.0" y="874" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">三维原生与生成结果分别保存</text><text x="1535.0" y="900" text-anchor="middle" font-size="18" font-weight="normal" fill="#203f51">生成图不转成独立实测或标签</text><rect x="1335" y="975" width="400" height="138" rx="11" fill="#e6eef6" stroke="#a5bfce" stroke-width="1.5"/><text x="1535.0" y="1007" text-anchor="middle" font-size="21" font-weight="bold" fill="#203f51">分项验收与强对照</text><text x="1535.0" y="1036" text-anchor="middle" font-size="18" fo