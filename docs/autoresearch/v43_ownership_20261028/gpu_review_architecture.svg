<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#527587"/></marker></defs><rect width="1400" height="900" fill="#f6fafc"/><g font-family="Microsoft YaHei,sans-serif" fill="#214858"><text x="40" y="45" font-size="28" font-weight="bold">V43：原生剥离诊断 + 共享opacity校准</text><rect x="40" y="80" width="1320" height="80" rx="12" fill="#dfeaf3" stroke="#8faebc"/><text x="700" y="112" text-anchor="middle" font-size="21">冻结场景 / Actor10K + 实拍RGB / 掩码 / 49帧贡献证据</text><text x="700" y="143" text-anchor="middle" font-size="18">无编辑请求 → V1原生通路；原检查点与owner不写回</text><rect x="40" y="210" width="640" height="440" rx="12" fill="#e1f2e9" stroke="#8faebc"/><rect x="720" y="210" width="640" height="440" rx="12" fill="#fff0d8" stroke="#8faebc"/><g font-size="23" font-weight="bold"><text x="65" y="250">① 原生语义剥离（31帧已完成）</text><text x="745" y="250">② 覆盖与边缘改进（四组10K）</text></g><g fill="white" stroke="#9db5c2"><rect x="65" y="280" width="590" height="75" rx="8"/><rect x="65" y="395" width="590" height="75" rx="8"/><rect x="65" y="510" width="590" height="105" rx="8"/><rect x="745" y="280" width="590" height="75" rx="8"/><rect x="745" y="395" width="590" height="75" rx="8"/><rect x="745" y="510" width="590" height="105" rx="8"/><rect x="40" y="710" width="1320" height="140" rx="12"/></g><g text-anchor="middle" font-size="20"><text x="360" y="310">基础低置信 / 混合支撑 + 可调轮廓带</text><text x="360" y="340" font-size="17">关闭额外带仍保留基础unknown；内外带包含路面</text><text x="360" y="426">跨49帧静态车辆外观候选 → unknown</text><text x="360" y="455" font-size="17">保留原语义与原分支；不强迁移整颗高斯</text><text x="360" y="542">四档剥离控制：全部 / 去U / 去车 / 两者去除</text><text x="360" y="573" font-size="17">同标签精确RGB合成 + alpha；主体减少仍有残留</text><text x="360" y="600" font-size="17">检查车影覆盖，同时记录道路与背景损失</text><text x="1040" y="310">同起点：整图 / 两域 / 分区 / 共享场</text><text x="1040" y="340" font-size="17">几何 / DC / 点数冻结，内外掩码监督均保留</text><text x="1040" y="426">按对象大小分区监督；共享场保留对照</text><text x="1040" y="455" font-size="17">完整外域监督；几何 / 颜色 / 点数冻结</text><text x="1040" y="542">独立覆盖 → 合成遮挡 → 缺面分别验收</text><text x="1040" y="573" font-size="17">第一场景33帧校准 / 16帧检查；仅更新opacity</text><text x="1040" y="600" font-size="17">未知侧面不靠增opacity封洞；第三场景继续暂缓</text><text x="700" y="746">③ 同一HTML：unknown来源 / 原语义 / 原分支 / 几何预览 / 原生RGB</text><text x="700" y="783" font-size="19">原生RGB / alpha / 实际几何同步；原模型与V1默认通路保留</text><text x="700" y="819" font-size="18">点隐藏不等于残影已清除；整幅多删不能证明精确归属成功</text></g><g stroke="#527587" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><path d="M360 160V203 M1040 160V203 M360 355V388 M360 470V503 M1040 355V388 M1040 470V503 M360 650V703 M1040 650V703"/></g></g><g fill="#527587"><path d="M354 195L366 195L360 203Z"/><path d="M1034 195L1046 195L1040 203Z"/><path d="M354 380L366 380L360 388Z"/><path d="M354 495L366 495L360 503Z"/><path d="M1034 380L1046 380L1040 388Z"/><path d="M1034 495L1046 495L1040 503Z"/><path d="M354 695L366 695L360 703Z"/><path d="M1034 695L1046 695L1040 703Z"/></g></svg>