<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="650" viewBox="0 0 1480 650" role="img" aria-labelledby="title desc">
<title id="title">E固定原表面材质回写：复用融合监督，不再增加道路几何</title>
<desc id="desc">最新v44与a5原几何和身份冻结。在四个BUILD视图资格中固定可写原static与oldroad行，用已有C融合完整图目标拟合一份共享RGB残差，再由原七组native joint render输出KEEP和仅删a37。目标不参与QUERY颜色或选行；原v44输入依赖保持。图只说明协议，成效另验收。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#557989"/></marker><style>text{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#193b4a}.t{font-size:25px;font-weight:600}.h{font-size:21px;font-weight:600}.s{font-size:17px}.b{fill:white;stroke:#8facbb;stroke-width:1.6}.l{fill:none;stroke:#557989;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect width="1480" height="650" fill="#f3f7f9"/><text x="28" y="42" class="t">候选E · 在已有表面回写外观，几何 / α / 身份保持原场景</text>
<rect class="b" x="30" y="92" width="330" height="150" rx="12"/><text x="195" y="130" class="h" text-anchor="middle">已有C融合监督</text><text x="195" y="166" class="s" text-anchor="middle">完整合成RGB目标＋原legal mask</text><text x="195" y="202" class="s" text-anchor="middle">94 / 105 / 128 / 137现为BUILD</text>
<rect class="b" x="30" y="345" width="330" height="160" rx="12"/><text x="195" y="383" class="h" text-anchor="middle">冻结最新v44＋a5</text><text x="195" y="419" class="s" text-anchor="middle">原static / oldroad / 车辆 / Env</text><text x="195" y="455" class="s" text-anchor="middle">原SH / fine先按原规则求色</text><text x="195" y="486" class="s" text-anchor="middle">无新增、退役或移动几何</text>
<rect class="b" x="440" y="345" width="300" height="160" rx="12"/><text x="590" y="383" class="h" text-anchor="middle">固定可写原有行</text><text x="590" y="419" class="s" text-anchor="middle">15,262 static＋19,114 oldroad</text><text x="590" y="455" class="s" text-anchor="middle">inside&gt;0 / guard mass==0</text><text x="590" y="486" class="s" text-anchor="middle">一次资格，索引跨query固定</text>
<rect class="b" x="440" y="92" width="300" height="150" rx="12"/><text x="590" y="130" class="h" text-anchor="middle">一份持久δRGB</text><text x="590" y="166" class="s" text-anchor="middle">zero init → 固定400 paired steps</text><text x="590" y="202" class="s" text-anchor="middle">Adam .01；δ投影到[-1,1]</text>
<rect class="b" x="820" y="213" width="280" height="180" rx="12"/><text x="960" y="253" class="h" text-anchor="middle">原生joint深度排序</text><text x="960" y="291" class="s" text-anchor="middle">原7组；颜色=max(原色＋δ,0)</text><text x="960" y="329" class="s" text-anchor="middle">KEEP / 仅DELETE原a37</text><text x="960" y="365" class="s" text-anchor="middle">同一δ，不按query图像选色</text>
<rect class="b" x="1180" y="213" width="270" height="180" rx="12"/><text x="1315" y="253" class="h" text-anchor="middle">先4帧固定门</text><text x="1315" y="291" class="s" text-anchor="middle">接缝＋车体＋道路外保护</text><text x="1315" y="329" class="s" text-anchor="middle">α / depth / groupW实际核对</text><text x="1315" y="365" class="s" text-anchor="middle">明确放行后才49</text>
<path class="l" d="M360 167H440"/><path class="l" d="M360 425H440"/><path class="l" d="M590 345V242"/><path class="l" d="M740 167H780V280H820"/><path class="l" d="M360 480V530H780V345H820"/><path class="l" d="M1100 303H1180"/>
