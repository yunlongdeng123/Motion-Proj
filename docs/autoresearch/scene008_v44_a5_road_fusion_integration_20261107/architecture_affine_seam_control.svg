<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="350" viewBox="0 0 1260 350" role="img" aria-labelledby="t d"><title id="t">固定几何下的道路材质接缝可行性控制</title><desc id="d">冻结21K场景、H2可见性和道路几何，通过原生贡献测量得到共享父RGB到固定接缝的线性映射，求一次满足近端和横向约束的最小材质改动，再用原生KEEP与DELETE实际检查。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3b667b"/></marker></defs><rect width="1260" height="350" fill="#f4f8fa"/><g fill="#183d4c" font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle"><text x="630" y="33" font-size="22" font-weight="bold">固定几何 · 同一份道路RGB · 接缝约束可行性控制</text><g stroke="#83a4b6" stroke-width="1.5" fill="#fff"><rect x="18" y="103" width="226" height="126" rx="10"/><rect x="282" y="103" width="225" height="126" rx="10"/><rect x="545" y="103" width="211" height="126" rx="10"/><rect x="794" y="103" width="201" height="126" rx="10"/><rect x="1033" y="103" width="209" height="126" rx="10"/></g><g font-size="17"><text x="131" y="134" font-weight="bold">冻结21K＋H2＋C2K</text><text x="131" y="166">相机、遮挡、几何不变</text><text x="131" y="198">仅2119父点RGB可改</text><text x="394" y="134" font-weight="bold">原生贡献测量</text><text x="394" y="166">53接缝bin／每状态</text><text x="394" y="198">检查 RGB 映射的线性</text><text x="650" y="134" font-weight="bold">一次颜色约束求解</text><text x="650" y="166">原near／lateral门</text><text x="650" y="198">最小可见材质改动</text><text x="894" y="134" font-weight="bold">持久父RGB表</text><text x="894" y="166">颜色范围[0,1]</text><text x="894" y="198">KEEP／DELETE共用</text><text x="1137" y="134" font-weight="bold">4帧原生重渲染</text><text x="1137" y="166">接缝＋完整保护门</text><text x="1137" y="198">图像与数值一起验</text></g><text x="630" y="281" font-size="16">一次求解是受限强控制；可行性不等于整体质量通过，不执行新场景训练或宽度／权重网格。</text><text x="630" y="315" font-size="15">不可行则记录该固定表示的边界；可行也须重新渲染并检验其余区域，未经验证不作为默认结果。</text></g><g fill="none" stroke="#3b667b" stroke-width="2" marker-end="url(#a)"><path d="M244 167H279"/><path d="M507 167H542"/><path d="M756 167H791"/><path d="M995 167H1030"/></g></svg>
