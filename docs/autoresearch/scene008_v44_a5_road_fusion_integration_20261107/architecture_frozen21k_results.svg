<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="480" viewBox="0 0 1320 480" role="img" aria-labelledby="title desc">
<title id="title">冻结21K底座：C49材质对照与H4可见性迭代</title><desc id="desc">同一冻结v44加a5场景和完整C道路资产，后台用49帧监督只训练道路RGB，前台用四帧测试车辆模型驱动的道路可见性保护。两条实验分别评价接缝、银片和保留车，不预设通过。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3b667b"/></marker></defs>
<rect width="1320" height="480" fill="#f4f8fa"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#183d4c" text-anchor="middle">
<text x="660" y="35" font-size="23" font-weight="bold">冻结21K底座 · 后台 C49 材质对照 · 四帧 H2＋K 接缝校正</text>
<g stroke="#84a5b7" stroke-width="1.5"><rect x="22" y="91" width="248" height="135" rx="10" fill="#e7f1fb"/><rect x="22" y="271" width="248" height="115" rx="10" fill="#e8f5ec"/><rect x="324" y="175" width="236" height="132" rx="10" fill="#fff"/><rect x="629" y="84" width="301" height="135" rx="10" fill="#edf6ef"/><rect x="629" y="271" width="301" height="135" rx="10" fill="#fff2df"/><rect x="1000" y="174" width="297" height="134" rx="10" fill="#fff"/></g>
<g font-size="17"><text x="146" y="124" font-weight="bold">已交付 v44 ＋ a5 车顶恢复</text><text x="146" y="156">原场景10K＋道路1K</text><text x="146" y="185">Full5恢复a5：10K</text><text x="146" y="211" font-size="14">组件累计21K；语义接入0K</text>
<text x="146" y="304" font-weight="bold">完整 C 道路资产</text><text x="146" y="335">40,392子点／10,098父点</text><text x="146" y="365" font-size="14">既有C材质作初始化，几何固定</text>
<text x="442" y="209" font-weight="bold">同一场景与三维身份接口</text><text x="442" y="241">KEEP／仅删除 a37</text><text x="442" y="275" font-size="14">车顶、身份、场景几何冻结</text>
<text x="780" y="116" font-weight="bold">后台 C49：只训练道路 RGB</text><text x="780" y="147">49帧C目标＋KEEP／DELETE配对</text><text x="780" y="176">smoke／恢复完成 → 正式2K</text><text x="780" y="202" font-size="14">上限暂10K，按平台与结果决定终点</text>
<text x="780" y="303" font-weight="bold">四帧 H2＋K：前景与材质</text><text x="780" y="334">模型贡献裁剪 → RGB约束求解</text><text x="780" y="365">6汇总＋106局部接缝门通过</text><text x="780" y="391" font-size="14">保护域尚未全过，不扩49</text>
<text x="1148" y="208" font-weight="bold">分别评价，不预设采用</text><text x="1148" y="240">接缝 · 银片 · 真实轮胎</text><text x="1148" y="272">车顶、身份与其他区域不回退</text>
</g>
<text x="660" y="450" font-size="15">smoke、恢复重放、资格测量和旧对照另计；既有C挡轮／接缝失败仍披露，默认结果保持。</text>
</g>
<g stroke="#3b667b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M270 159H294V218H321"/><path d="M270 328H294V270H321"/><path d="M560 218H592V151H626"/><path d="M560 271H592V338H626"/><path d="M930 151H965V214H997"/><path d="M930 338H965V267H997"/></g>
