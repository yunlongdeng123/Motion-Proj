<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="710" viewBox="0 0 1480 710" role="img" aria-labelledby="title desc">
<title id="title">道路融合接入验证：最新v44加a5冻结，AA与C分开，四帧先验证</title>
<desc id="desc">固定最新完整a5与v44基线，分别增加同40392行道路支撑的AA材质和C材质，使用一次原生共同深度排序，输出KEEP和仅删a37；按原mask和边界评价，经明确四帧图检后才能扩49。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#557989"/></marker><style>text{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#193b4a}.title{font-size:25px;font-weight:600}.head{font-size:21px;font-weight:600}.small{font-size:17px}.box{fill:white;stroke:#8facbb;stroke-width:1.6}.line{fill:none;stroke:#557989;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1480" height="710" fill="#f3f7f9"/><text x="28" y="42" class="title">先分开支撑与材质增量，再判断接缝改善和原效果保持</text>
<rect class="box" x="30" y="92" width="330" height="162" rx="12"/><text x="195" y="130" class="head" text-anchor="middle">冻结最新 v44＋a5</text><text x="195" y="166" class="small" text-anchor="middle">语义sidecar / C2 / 背景 / Env</text><text x="195" y="200" class="small" text-anchor="middle">原道路、删除规则与相机时间</text><text x="195" y="232" class="small" text-anchor="middle">baseline：不增加道路资产</text>
<rect class="box" x="30" y="326" width="330" height="168" rx="12"/><text x="195" y="364" class="head" text-anchor="middle">已有道路候选资产</text><text x="195" y="400" class="small" text-anchor="middle">同40,392行 n2＋relativeMip</text><text x="195" y="434" class="small" text-anchor="middle">AA原材质 / C 10px锚定材质</text><text x="195" y="466" class="small" text-anchor="middle">C旧近端负结果保留</text>
<rect class="box" x="440" y="205" width="300" height="168" rx="12"/><text x="590" y="243" class="head" text-anchor="middle">固定场景独立比较</text><text x="590" y="279" class="small" text-anchor="middle">latest / ＋AA / ＋C / 后验D</text><text x="590" y="313" class="small" text-anchor="middle">AA、C同支撑，不重训调色</text><text x="590" y="345" class="small" text-anchor="middle">KEEP / 仅DELETE a37</text>
<rect class="box" x="820" y="205" width="270" height="168" rx="12"/><text x="955" y="243" class="head" text-anchor="middle">原生共同深度排序</text><text x="955" y="279" class="small" text-anchor="middle">固定3D资产始终启用</text><text x="955" y="313" class="small" text-anchor="middle">两状态只切原a37</text><text x="955" y="345" class="small" text-anchor="middle">无屏幕拼图或query调色</text>
<rect class="box" x="1170" y="205" width="280" height="168" rx="12"/><text x="1310" y="243" class="head" text-anchor="middle">四帧原图＋固定数值门</text><text x="1310" y="279" class="small" text-anchor="middle">94 / 105 / 128 / 137</text><text x="1310" y="313" class="small" text-anchor="middle">a5 / a6 / 道路外不得回退</text><text x="1310" y="345" class="small" text-anchor="middle">明确审阅放行后才49</text>
<path class="line" d="M360 173H400V255H440"/><path class="line" d="M360 410H400V325H440"/><path class="line" d="M740 289H820"/><path class="line" d="M1090 289H1170"/>
<rect class="box" x="440" y="420" width="650" height="118" rx="12"/><text x="765" y="456" class="head" text-anchor="middle">D后验：4BUILD固定安全新增行</text><text x="765" y="490" class="small" text-anchor="middle">inside&gt;0 / outside==0；保护既有模型车体贡献</text><text x="765" y="520" class="small" text-anchor="middle">同一mask跨query / KEEP / DELETE；原门不变</text><path class="line" d="M360 460H440"/><path class="line" d="M590 420V373"/><text x="30" y="630" class="small">原固定mask / 原128六bin / 世界near与lateral分表；far无分母保持null。raw130轮胎诊断独立计账。</text>
<text x="30" y="674" class="small">旧C与本次首关负项保留；QUERY按固定三维资产成像，原v44输入依赖保持。必须实际成像，不以筛选成功代验收。</text>
</svg>
