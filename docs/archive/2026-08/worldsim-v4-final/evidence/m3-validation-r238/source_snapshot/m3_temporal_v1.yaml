  operates_on: edited_minus_base_rgb_delta
  output_resolution_reduced: false
  remove_bypass_exact: true

ablations:
  arms: [FRAME_INDEPENDENT, LINEAR, CUBIC_BSPLINE,
         CUBIC_BSPLINE_TEMPORAL_EVIDENCE, FULL_WARP_REGULARIZED]
  same_base: true
  same_clip: true
  same_edit_request: true

metrics:
  [psnr, ssim, lpips_alex, temporal_lpips, warp_l1, warp_lpips,
   frame_flicker, mask_iou_jitter, boundary_f1_jitter, identity_switch,
   trajectory_rmse, centroid_jitter, contact_region_jitter,
   semantic_reintroduction, rollback_exact]

gates:
  operation_success_non_degradation: true
  temporal_error_relative_improvement_min: 0.10
  identity_switch_relative_reduction_min: 0.25
  allow_identity_zero_remains_zero: true
  deleted_semantic_reintroduction: 0
  rollback_exact_fraction: 1.0

immutability:
  base_checkpoint_mutation: false
  composition_order: [BASE, ERASE, INSERT]
  rollback_render_sha_exact: true
