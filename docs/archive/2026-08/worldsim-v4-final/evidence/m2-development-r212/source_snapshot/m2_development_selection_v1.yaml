selection:
  unit: scene
  objective: minimize_scene_balanced_policy_edit_error
  actual_error_on_abstain: atomic_noop_edit_error
  abstained_group_error: lowest_risk_candidate_counterfactual_edit_error
  require_nonempty_accepted_and_abstained_groups: true
  require_meaningful_abstention: true
  tie_break:
    - request_mean_policy_edit_error
    - maximum_request_coverage
    - weight_grid_order
    - threshold_grid_order

acceptance_gates:
  comparison: best_matched_non_router_by_scene_balanced_policy_edit_error
  unavailable_arm_action: atomic_abstain
  global_valid:
    psnr_delta_db_min: -0.10
    ssim_delta_min: -0.002
    lpips_delta_max: 0.01
  hole_endpoints:
    require_any_strict_improvement: true
    metrics:
      hole_cross_view_psnr_db: maximize
      hole_geometry_mae_m: minimize
    same_view_background_gt_metrics: undefined_not_scored
  static_lidar_depth_mae_degradation_m_max: 0.02
  selective:
    require_abstain_error_gt_accepted_error: true

reporting:
  retain_all_six_scenes_in_denominator: true
  report_request_and_scene_balanced_metrics: true
  report_composite_edit_error_even_when_not_a_gate: true
  requested_selective_coverages: [0.25, 0.5, 0.75, 1.0]
  heldout_content_read: false
  test_quality_read: false
